            !docs/verification/orion-pro-api-coverage-20261105/runs/**/runtime/**/node_modules
            !docs/verification/orion-pro-api-coverage-20261105/runs/**/runtime/**/node_modules/**
            !docs/verification/orion-pro-real-native-spatial-20261104/runs/**/overlay-cli/alias.sql
