name: Verify ingestion
on:
  push:
    paths: &source_paths
      - '.github/**'
      - 'dashboard/**'
      - 'infra/**'
      - 'tests/**'
      - 'docs/architecture/**'
      - 'docs/verification/**'
  pull_request:
    paths: *source_paths

permissions:
  contents: read
jobs:
  orion-pro:
    name: Orion Pro PostgreSQL and offline RDS contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PYTHONPATH: /tmp/statarena-ci-python
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .github/workflows
            infra/aws-db-maintenance
            dashboard/scripts
            dashboard/backend
            dashboard/frontend/src
            dashboard/frontend/app
            dashboard/shared
            tests
            docs/architecture/orion-plan-20261104
            docs/architecture/orion-native-details-107-20261105
            docs/verification/orion-pro-native107-20261105
            docs/verification/orion-pro-match-readers-20261105
            docs/verification/orion-pro-match-details-20261104
            docs/verification/orion-pro-match-core-fields-20261105
            docs/verification/orion-pro-pilot-20261104
            docs/verification/orion-pro-readers-20261104
            docs/verification/orion-pro-frontend-20261104
            docs/verification/orion-pro-native-contracts-20261104
            docs/verification/orion-pro-heatmaps-20261104
            docs/verification/orion-pro-bulk-20261104
            docs/verification/orion-pro-real-native-spatial-20261104
            docs/verification/orion-pro-api-coverage-20261105
            docs/verification/orion-pro-entities-20261105
            docs/verification/orion-pro-entity-batch-media-20261105
            docs/verification/orion-pro-operations-20261105
            docs/verification/orion-pro-runtime-origin-20261105
            docs/verification/orion-pro-appearances-20261105
            docs/verification/orion-pro-fixture-aliases-20261105
            docs/verification/orion-pro-competitions-20261105
            docs/verification/orion-pro-archives-20261105
            docs/verification/orion-pro-enrichment-20261105
            docs/verification/orion-pro-rankings-20261105
            docs/verification/orion-pro-player-statistics-20261105
            docs/verification/orion-pro-publisher-20261105/product-campaign
            docs/verification/orion-pro-observed-profile-20261105
            docs/verification/orion-pro-appearances-regression-20261105
            docs/verification/orion-validator-membership-20261105
            docs/verification/orion-real-spatial-digest-20261105
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: dashboard/scripts/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'
      - name: Verify official pinned Node24 runtime for exact numeric JSON
        run: |
          mkdir -p /tmp/statarena-node24-runtime/v24.22.2
          curl --fail --location --retry 2 https://nodejs.org/dist/v24.22.2/node-v24.22.2-linux-x64.tar.xz --output /tmp/statarena-node24-runtime/v24.22.2/node-v24.22.2-linux-x64.tar.xz
          printf '%s  %s\n' 48cc0e21e048790e54c0cf5749c2725005313d652651c40b7a21feb9697aaf75 /tmp/statarena-node24-runtime/v24.22.2/node-v24.22.2-linux-x64.tar.xz | sha256sum --check
          tar -xJf /tmp/statarena-node24-runtime/v24.22.2/node-v24.22.2-linux-x64.tar.xz -C /tmp/statarena-node24-runtime/v24.22.2
      - name: Install local PostgreSQL and Python dependencies
        run: |
          python -m pip install --target /tmp/statarena-ci-python -r dashboard/scripts/requirements.txt
          mkdir -p /tmp/statarena-cache-test-tools
          cd /tmp/statarena-cache-test-tools
          npm install --no-save --no-package-lock --no-audit --no-fund embedded-postgres@18.6.0-beta.19
      - name: Install dashboard dependencies
        working-directory: dashboard
        run: bun install --frozen-lockfile
      - name: Verify AWS-only frontend and maintenance contracts
        run: /tmp/statarena-node24-runtime/v24.22.2/node-v24.22.2-linux-x64/bin/node --test tests/aws-only-runtime.test.mjs tests/aws-delivery.test.mjs tests/aws-maintenance.test.mjs
      - name: Verify navigation, bounded search and deferred actor analysis
        run: >-
          BUN_BINARY="$(command -v bun)" node --test
          tests/navigation-performance.test.mjs
          tests/navigation-prefetch.test.mjs
          tests/home-bootstrap.test.mjs
          tests/home-bootstrap-preferences.test.mjs
          tests/media-registry.test.mjs
          tests/resolved-media.test.mjs
          tests/relational-home-cache.test.mjs
          tests/home-projection.test.mjs
          tests/archive-navigation.test.mjs
          tests/archive.test.mjs
          tests/club-overview-loading.test.mjs
          tests/bounded-reads.test.mjs
          tests/compact-reads.test.mjs
          tests/compact-render.test.mjs
          tests/resource-cache.test.mjs
          tests/public-api-fetch.test.mjs
          tests/initial-page.test.mjs
          tests/media-assets.test.mjs
          tests/resource-hook-identity.test.mjs
          tests/competition-render.test.mjs
          tests/season_player_render.test.mjs
          tests/player-season-selected.test.mjs
          tests/player-position-summary.test.mjs
          tests/player-overview-radar.test.mjs
          tests/player-career.test.mjs
          tests/competition-highlights-render.test.mjs
          tests/competition-standings-notice.test.mjs
          tests/club-profile-render.test.mjs
          tests/cup-render.test.mjs
          tests/competition-matchdays.test.mjs
          tests/player-competition-matches.test.mjs
          tests/player-international-career.test.mjs
      - name: Verify compact reads, freshness and incremental publications
        run: >-
          python3 tests/run_public_read_contracts.py
          --pg-bin /tmp/statarena-cache-test-tools/node_modules/@embedded-postgres/linux-x64/native/bin
      - name: Verify safe retirement of reserved model tables
        run: >-
          python3 tests/retire_models_postgres.py
          --pg-bin /tmp/statarena-cache-test-tools/node_modules/@embedded-postgres/linux-x64/native/bin
      - name: Exercise the complete local schema workflow
        run: >-
          python3 tests/orion_pro_pilot_postgres.py
          --pg-bin /tmp/statarena-cache-test-tools/node_modules/@embedded-postgres/linux-x64/native/bin
          --python-path /tmp/statarena-ci-python
          --run-label ci-${{ github.run_id }}
      - name: Exercise native metric states and retained corrections
        run: >-
          python3 tests/orion_pro_metric_states_postgres.py
          --pg-bin /tmp/statarena-cache-test-tools/node_modules/@embedded-postgres/linux-x64/native/bin
          --python-path /tmp/statarena-ci-python
          --amendment-receipt docs/verification/orion-pro-pilot-20261104/model-amendments.json
          --run-label ci-${{ github.run_id }}
      - name: Exercise offline RDS rejection gates without cloud access
        run: python3 tests/orion_pro_rds_gate.py --label ci-${{ github.run_id }}
      - name: Reject schema and column-privilege drift through local TLS
        run: >-
          python3 tests/orion_pro_rds_readback_local.py
          --pg-bin /tmp/statarena-cache-test-tools/node_modules/@embedded-postgres/linux-x64/native/bin
          --label ci-${{ github.run_id }}
      - name: Apply and reapply through the existing admin credential shape locally
        run: >-
          python3 tests/orion_pro_rds_apply_local.py
          --pg-bin /tmp/statarena-cache-test-tools/node_modules/@embedded-postgres/linux-x64/native/bin
          --label ci-${{ github.run_id }}
      - name: Resume typed phases and reject unsafe captures without cloud access
        run: >-
          python3 tests/orion_pro_real_pilot.py
          --pg-bin /tmp/statarena-cache-test-tools/node_modules/@embedded-postgres/linux-x64/native/bin
          --preflight-only --label ci-${{ github.run_id }}
      - name: Preserve all registered native common metrics and reject old writer contracts
        run: >-
          python3 tests/orion_pro_native_contracts_local.py
          --pg-bin /tmp/statarena-cache-test-tools/node_modules/@embedded-postgres/linux-x64/native/bin
          --label ci-${{ github.run_id }}
      - name: Preserve sparse heatmaps, source locators and native collection states
        run: >-
          python3 tests/orion_pro_heatmaps_local.py
          --pg-bin /tmp/statarena-cache-test-tools/node_modules/@embedded-postgres/linux-x64/native/bin
          --label ci-${{ github.run_id }}
      - name: Copy typed native phases and resume exact prefixes without remote access
        run: >-
          python3 tests/orion_pro_bulk_local.py
          --pg-bin /tmp/statarena-cache-test-tools/node_modules/@embedded-postgres/linux-x64/native/bin
          --label ci-${{ github.run_id }}
      - name: Reject unsafe source captures offline without reading real data
        run: >-
          python3 docs/verification/orion-pro-real-native-spatial-20261104/e2e.py
          --pg-bin /tmp/statarena-cache-test-tools/node_modules/@embedded-postgres/linux-x64/native/bin
          --prepare-only --label ci-${{ github.run_id }}
      - name: Preserve exact spatial numeric values across independent digest representations
        run: >-
          python3 docs/verification/orion-real-spatial-digest-20261105/e2e_serializer.py
          --label ci-${{ github.run_id }}
      - name: Serve immutable typed pages, summaries and lazy shots over HTTP
        run: >-
          python3 tests/orion_pro_readers_local.py
          --pg-bin /tmp/statarena-cache-test-tools/node_modules/@embedded-postgres/linux-x64/native/bin
          --label ci-${{ github.run_id }}
      - name: Pin client pagination and bounded caches to published representations
        run: >-
          python3 tests/orion_pro_frontend_local.py
          --pg-bin /tmp/statarena-cache-test-tools/node_modules/@embedded-postgres/linux-x64/native/bin
          --label ci-${{ github.run_id }}
      - name: Close unversioned Pro fallbacks and preserve legacy and native HTTP contracts
        run: >-
          python3 tests/orion_pro_route_guard_local.py
          --pg-bin /tmp/statarena-cache-test-tools/node_modules/@embedded-postgres/linux-x64/native/bin
          --label ci-${{ github.run_id }}
          --baseline-receipt docs/verification/orion-pro-api-coverage-20261105/runs/20261104T234428216754Z-media-formats-pre-guard-red/result.json
      - name: Serve edition-bound entity profiles through the actual AWS router
        run: >-
          python3 tests/orion_pro_entities_local.py
          --pg-bin /tmp/statarena-cache-test-tools/node_modules/@embedded-postgres/linux-x64/native/bin
          --label ci-${{ github.run_id }}
      - name: Batch entity catalogue metadata and revalidate linked typed media
        run: >-
          python3 tests/orion_pro_entity_batch_media_local.py
          --pg-bin /tmp/statarena-cache-test-tools/node_modules/@embedded-postgres/linux-x64/native/bin
          --label ci-${{ github.run_id }}
          --compare-red docs/verification/orion-pro-entity-batch-media-20261105/runs/20261105T121925487909Z-batch-budget-red/result.json
      - name: Serve typed operational health settings and media on Node24
        run: >-
          python3 tests/orion_pro_operations_local.py
          --pg-bin /tmp/statarena-cache-test-tools/node_modules/@embedded-postgres/linux-x64/native/bin
          --label ci-${{ github.run_id }}
      - name: Refuse Neon fallback for unconfigured Pro runtime on Node24
        run: >-
          python3 tests/orion_pro_runtime_origin_local.py
          --label ci-${{ github.run_id }}
      - name: Read all typed appearance pages with original22 scenarios
        run: >-
          python3 tests/orion_pro_appearances_regression_local.py
          --node24 /tmp/statarena-node24-runtime/v24.22.2/node-v24.22.2-linux-x64/bin/node
          --pg-bin /tmp/statarena-cache-test-tools/node_modules/@embedded-postgres/linux-x64/native/bin
          --label ci-${{ github.run_id }}
      - name: Preserve closed physical profiles through catalogue corrections
        run: >-
          python3 tests/orion_pro_observed_profile_local.py --coordinate-upgrade
          --node24 /tmp/statarena-node24-runtime/v24.22.2/node-v24.22.2-linux-x64/bin/node
          --pg-bin /tmp/statarena-cache-test-tools/node_modules/@embedded-postgres/linux-x64/native/bin
          --label ci-${{ github.run_id }}
      - name: Read versioned date and league fixture aliases
        run: >-
          python3 tests/orion_pro_fixture_aliases_local.py
          --node24 /tmp/statarena-node24-runtime/v24.22.2/node-v24.22.2-linux-x64/bin/node
          --pg-bin /tmp/statarena-cache-test-tools/node_modules/@embedded-postgres/linux-x64/native/bin
          --label ci-${{ github.run_id }}
      - name: Verify eight published competition routes through the actual AWS router
        run: |
          release="$PWD/docs/verification/orion-pro-competitions-20261105/ROOT_OWNED_COMPETITIONS_CI.json"
          python3 - "$release" <<'PY_CI'
          import json, os, subprocess, sys
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          manifest=json.loads(subprocess.check_output([sys.executable,'-I','tests/orion_pro_competitions_local.py','--manifest'],text=True))
          release={'kind':'competition_owned_e2e_release_v1','scope':'owned_source_free_only',
                   'allocationId':'owned-competitions-ci-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT'],
                   'inputHashes':manifest,'ownedBaseCommit':os.environ['GITHUB_SHA'],
                   'expiresAt':(datetime.now(timezone.utc)+timedelta(minutes=10)).isoformat(),'actualApp':True,
                   'bounds':{'seconds':600,'sql':15000,'http':200,'typedRows':20000,'ownedDiskBytes':1024**3,
                             'evidenceBytes':96*1024**2,'connections':5,'workers':2}}
          Path(sys.argv[1]).write_text(json.dumps(release,indent=2)+'\n')
          PY_CI
          python3 tests/orion_pro_competitions_local.py --run-owned --actual-app --release "$release" \
            --release-sha256 "$(sha256sum "$release" | cut -d ' ' -f 1)" \
            --node24 /tmp/statarena-node24-runtime/v24.22.2/node-v24.22.2-linux-x64/bin/node \
            --pg-bin /tmp/statarena-cache-test-tools/node_modules/@embedded-postgres/linux-x64/native/bin \
            --label ci-${{ github.run_id }}
      - name: Verify four published archive routes through the actual AWS router
        run: |
          release="$PWD/docs/verification/orion-pro-archives-20261105/ROOT_OWNED_ARCHIVES_CI.json"
          python3 - "$release" <<'PY_CI'
          import json, os, subprocess, sys
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          manifest=json.loads(subprocess.check_output([sys.executable,'-I','tests/orion_pro_archives_local.py','--manifest'],text=True))
          release={'kind':'archive_owned_e2e_release_v1','scope':'owned_source_free_only',
                   'allocationId':'owned-archives-ci-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT'],
                   'inputHashes':manifest,'ownedBaseCommit':os.environ['GITHUB_SHA'],
                   'expiresAt':(datetime.now(timezone.utc)+timedelta(minutes=10)).isoformat(),'actualApp':True,
                   'bounds':{'seconds':600,'sql':15000,'http':200,'typedRows':20000,'ownedDiskBytes':1024**3,
                             'evidenceBytes':96*1024**2,'connections':5,'workers':2}}
          Path(sys.argv[1]).write_text(json.dumps(release,indent=2)+'\n')
          PY_CI
          python3 tests/orion_pro_archives_local.py --run-owned --actual-app --release "$release" \
            --release-sha256 "$(sha256sum "$release" | cut -d ' ' -f 1)" \
            --node24 /tmp/statarena-node24-runtime/v24.22.2/node-v24.22.2-linux-x64/bin/node \
            --pg-bin /tmp/statarena-cache-test-tools/node_modules/@embedded-postgres/linux-x64/native/bin \
            --label ci-${{ github.run_id }}
      - name: Verify five published enrichment routes through the actual AWS router
        run: |
          release="$PWD/docs/verification/orion-pro-enrichment-20261105/ROOT_OWNED_ENRICHMENT_CI.json"
          python3 - "$release" <<'PY_CI'
          import json, os, subprocess, sys
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          manifest=json.loads(subprocess.check_output([sys.executable,'-I','tests/orion_pro_enrichment_local.py','--manifest'],text=True))
          release={'kind':'enrichment_owned_e2e_release_v1','scope':'owned_source_free_only',
                   'allocationId':'owned-enrichment-ci-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT'],
                   'inputHashes':manifest,'ownedBaseCommit':os.environ['GITHUB_SHA'],
                   'expiresAt':(datetime.now(timezone.utc)+timedelta(minutes=10)).isoformat(),'actualApp':True,
                   'bounds':{'seconds':600,'sql':15000,'http':200,'typedRows':20000,'ownedDiskBytes':1024**3,
                             'evidenceBytes':96*1024**2,'connections':5,'workers':2}}
          Path(sys.argv[1]).write_text(json.dumps(release,indent=2)+'\n')
          PY_CI
          python3 tests/orion_pro_enrichment_local.py --run-owned --actual-app --release "$release" \
            --release-sha256 "$(sha256sum "$release" | cut -d ' ' -f 1)" \
            --node24 /tmp/statarena-node24-runtime/v24.22.2/node-v24.22.2-linux-x64/bin/node \
            --pg-bin /tmp/statarena-cache-test-tools/node_modules/@embedded-postgres/linux-x64/native/bin \
            --label ci-${{ github.run_id }}
      - name: Verify approved native match migrations and immutable observations
        run: |
          python3 -I dashboard/scripts/orion_pro_native107_schema.py --check
          python3 -I dashboard/scripts/orion_pro_native107_core.py --check
          python3 tests/orion_pro_native107_sql_local.py --run-owned --core-fields017 \
            --pg-bin /tmp/statarena-cache-test-tools/node_modules/@embedded-postgres/linux-x64/native/bin \
            --label native-core-017-ci-${{ github.run_id }}
      - name: Verify native match routes through the actual Node24 router (016)
        run: >-
          python3 tests/orion_pro_match_readers_local.py --phase after --target 016
          --node24 /tmp/statarena-node24-runtime/v24.22.2/node-v24.22.2-linux-x64/bin/node
          --pg-bin /tmp/statarena-cache-test-tools/node_modules/@embedded-postgres/linux-x64/native/bin
          --label native-016-ci-${{ github.run_id }}
      - name: Verify native match routes through the actual Node24 router (017)
        run: >-
          python3 tests/orion_pro_match_readers_local.py --phase after --target 017
          --node24 /tmp/statarena-node24-runtime/v24.22.2/node-v24.22.2-linux-x64/bin/node
          --pg-bin /tmp/statarena-cache-test-tools/node_modules/@embedded-postgres/linux-x64/native/bin
          --label native-017-ci-${{ github.run_id }}
      - name: Verify normalized single-shot and player-shot routes through the actual AWS router
        run: >-
          python3 tests/orion_pro_shot_details_local.py --phase after
          --node24 /tmp/statarena-node24-runtime/v24.22.2/node-v24.22.2-linux-x64/bin/node
          --pg-bin /tmp/statarena-cache-test-tools/node_modules/@embedded-postgres/linux-x64/native/bin
          --label shot-details-ci-${{ github.run_id }}
      - name: Verify composite 017 player and half statistics through the actual AWS router
        run: >-
          python3 tests/orion_pro_player_period_local.py --phase after
          --node24 /tmp/statarena-node24-runtime/v24.22.2/node-v24.22.2-linux-x64/bin/node
          --pg-bin /tmp/statarena-cache-test-tools/node_modules/@embedded-postgres/linux-x64/native/bin
          --label player-periods-ci-${{ github.run_id }}
      - name: Verify spatial and advanced match statistics through the actual AWS router
        run: >-
          python3 tests/orion_pro_spatial_advanced_local.py --phase after
          --node24 /tmp/statarena-node24-runtime/v24.22.2/node-v24.22.2-linux-x64/bin/node
          --pg-bin /tmp/statarena-cache-test-tools/node_modules/@embedded-postgres/linux-x64/native/bin
          --label spatial-advanced-ci-${{ github.run_id }}
      - name: Verify four published FIFA and UEFA ranking routes through the actual AWS router
        run: |
          release="$PWD/docs/verification/orion-pro-rankings-20261105/ROOT_OWNED_RANKINGS_CI.json"
          python3 - "$release" <<'PY_CI'
          import json, os, subprocess, sys
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          manifest=json.loads(subprocess.check_output([sys.executable,'-I','tests/orion_pro_rankings_local.py','--manifest'],text=True))
          release={'kind':'rankings_owned_e2e_release_v1','scope':'owned_source_free_only',
                   'allocationId':'owned-rankings-ci-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT'],
                   'inputHashes':manifest,'ownedBaseCommit':os.environ['GITHUB_SHA'],
                   'expiresAt':(datetime.now(timezone.utc)+timedelta(minutes=10)).isoformat(),'actualApp':True,
                   'bounds':{'seconds':600,'sql':15000,'http':200,'typedRows':20000,'ownedDiskBytes':1024**3,
                             'evidenceBytes':96*1024**2,'connections':5,'workers':2}}
          Path(sys.argv[1]).write_text(json.dumps(release,indent=2)+'\n')
          PY_CI
          python3 tests/orion_pro_rankings_local.py --run-owned --actual-app --release "$release" \
            --release-sha256 "$(sha256sum "$release" | cut -d ' ' -f 1)" \
            --node24 /tmp/statarena-node24-runtime/v24.22.2/node-v24.22.2-linux-x64/bin/node \
            --pg-bin /tmp/statarena-cache-test-tools/node_modules/@embedded-postgres/linux-x64/native/bin \
            --label ci-${{ github.run_id }}
      - name: Preserve reproducible PostgreSQL and CLI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orion-pro-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            docs/verification/orion-pro-pilot-20261104/runs/*-ci-*/
            docs/verification/orion-pro-pilot-20261104/metric-state-runs/*-ci-*/
            docs/verification/orion-pro-pilot-20261104/rds-gate-runs/*-ci-*/
            docs/verification/orion-pro-pilot-20261104/rds-runs/*-cli-e2e-*/
            docs/verification/orion-pro-pilot-20261104/rds-readback-local-runs/*-ci-*/
            docs/verification/orion-pro-pilot-20261104/rds-apply-local-runs/*-ci-*/
            docs/verification/orion-pro-pilot-20261104/rds-readbacks/*-ci-*/
            docs/verification/orion-pro-pilot-20261104/expected-catalogues/*-ci-*/
            docs/verification/orion-pro-pilot-20261104/real-source-runs/*-ci-*/
            docs/verification/orion-pro-readers-20261104/runs/*-ci-*/
            docs/verification/orion-pro-frontend-20261104/runs/*-ci-*/
            docs/verification/orion-pro-native-contracts-20261104/runs/*-ci-*/
            docs/verification/orion-pro-heatmaps-20261104/runs/*-ci-*/
            docs/verification/orion-pro-bulk-20261104/runs/*-ci-*/
            docs/verification/orion-pro-real-native-spatial-20261104/runs/*-ci-*/
            docs/verification/orion-real-spatial-digest-20261105/runs/*-ci-*/
            docs/verification/orion-pro-api-coverage-20261105/runs/*-ci-*/
            docs/verification/orion-pro-entities-20261105/runs/*-ci-*/
