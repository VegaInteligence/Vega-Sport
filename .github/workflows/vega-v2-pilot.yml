name: Vega v2 isolated pilot
on:
  push:
    branches: ['codex/vega-schema-v2-*', 'claude/v2-*']
    paths: ['v2/**', '.github/workflows/vega-v2-pilot.yml']
  workflow_dispatch:
    inputs:
      max_matches:
        description: Finished Ligue 1 2025/26 matches (1 to 306)
        type: string
        default: '1'
permissions:
  contents: read
concurrency:
  group: vega-v2-isolated-pilot
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    services:
      postgres:
        # pgvector image: the optional vector migration is tested too, not skipped.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-v2-only
          POSTGRES_DB: vega_v2_pilot
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: v2
      V2_DATABASE_URL: postgresql://postgres:isolated-v2-only@127.0.0.1:5432/vega_v2_pilot
      VEGA_V2_TEST_DSN: postgresql://postgres:isolated-v2-only@127.0.0.1:5432/vega_v2_test
      VEGA_V2_JOBS_TEST_DSN: postgresql://postgres:isolated-v2-only@127.0.0.1:5432/vega_v2_jobs_test
      VEGA_V2_STORE_TEST_DSN: postgresql://postgres:isolated-v2-only@127.0.0.1:5432/vega_v2_store_test
      VEGA_V2_PILOT_TEST_DSN: postgresql://postgres:isolated-v2-only@127.0.0.1:5432/vega_v2_pilot_test
      VEGA_V2_PROFILES_TEST_DSN: postgresql://postgres:isolated-v2-only@127.0.0.1:5432/vega_v2_profiles_test
      VEGA_V2_CONCURRENCY_TEST_DSN: postgresql://postgres:isolated-v2-only@127.0.0.1:5432/vega_v2_concurrency_test
      VEGA_V2_UNKNOWN_TEST_DSN: postgresql://postgres:isolated-v2-only@127.0.0.1:5432/vega_v2_unknown_test
      VEGA_V2_VALIDATED_TEST_DSN: postgresql://postgres:isolated-v2-only@127.0.0.1:5432/vega_v2_validated_test
      VEGA_V2_WORKER_TEST_DSN: postgresql://postgres:isolated-v2-only@127.0.0.1:5432/vega_v2_worker_test
      VEGA_V2_MODELS_TEST_DSN: postgresql://postgres:isolated-v2-only@127.0.0.1:5432/vega_v2_models_test
      VEGA_V2_ROLES_TEST_DSN: postgresql://postgres:isolated-v2-only@127.0.0.1:5432/vega_v2_roles_test
      VEGA_V2_SOURCES_TEST_DSN: postgresql://postgres:isolated-v2-only@127.0.0.1:5432/vega_v2_sources_test
      VEGA_V2_API_NODE_TEST_DSN: postgresql://postgres:isolated-v2-only@127.0.0.1:5432/vega_v2_api_node_test
      VEGA_V2_AGG_TEST_DSN: postgresql://postgres:isolated-v2-only@127.0.0.1:5432/vega_v2_agg_test
      VEGA_V2_API_TEST_DSN: postgresql://postgres:isolated-v2-only@127.0.0.1:5432/vega_v2_api_test
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r v2/requirements.txt
      - name: Create disposable test databases
        run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ['V2_DATABASE_URL'], autocommit=True) as db:
              for name in ('vega_v2_test','vega_v2_jobs_test','vega_v2_store_test','vega_v2_pilot_test','vega_v2_profiles_test','vega_v2_concurrency_test','vega_v2_unknown_test','vega_v2_validated_test','vega_v2_agg_test','vega_v2_api_test','vega_v2_worker_test','vega_v2_models_test','vega_v2_roles_test','vega_v2_api_node_test','vega_v2_sources_test'):
                  db.execute(psycopg.sql.SQL('CREATE DATABASE {}').format(psycopg.sql.Identifier(name)))
          PY
      - name: Validate typed schema, normalization and transactional ingestion
        run: python -m unittest discover -s v2/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read API contract tests (v2/api, read role only)
        run: npm ci --prefix v2/api && npm test --prefix v2/api
      - name: Verify previously failing event, shot and upstream-error fixtures
        env:
          PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
          MATCH_INPUT: ${{ inputs.max_matches }}
        run: |
          scope="${MATCH_INPUT:-$(cat v2/pilot-scope.txt)}"
          if [ "$scope" = 306 ]; then
            python -m vega_v2.pilot --ordinals 19,20,227,228 --max-matches 4 --profile-limit 2 --interval 0.25 --report work/vega-v2-regressions.md
          fi
      - name: Fresh PitchAPI collection into local PostgreSQL only
        env:
          PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
          MATCH_INPUT: ${{ inputs.max_matches }}
        run: |
          scope="${MATCH_INPUT:-$(cat v2/pilot-scope.txt)}"
          if python -m vega_v2.pilot --max-matches "$scope" --resume --profile-limit 2 --interval 0.25 --report work/vega-v2-pilot-initial.md; then
            cp work/vega-v2-pilot-initial.md work/vega-v2-pilot.md
          else
            python -m vega_v2.pilot --max-matches "$scope" --resume --profile-limit 2 --interval 0.25 --report work/vega-v2-pilot.md
          fi
      - name: Worker loop on the real J-1..J+7 calendars, local PostgreSQL only
        env:
          PITCHAPI_API_KEY: ${{ secrets.PITCHAPI_API_KEY }}
        run: python -m vega_v2.worker --max-jobs 700 --interval 0.25 --cohort-delay 0 --report work/vega-v2-worker.md
      - name: Export measurements only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vega-v2-pilot-measurements
          path: work/vega-v2-*.md
          if-no-files-found: warn
          retention-days: 14
