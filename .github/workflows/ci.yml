name: CI
# The suites of the backend, the infrastructure templates, the worker image, the read API package and the site's tests
# and build. A pull request or a branch push runs only the jobs its files can break (job « Changed zones »,
# backend/ci/changed_suites.py: a site-only change runs no Python, Deploy or API suite; a path no rule knows runs
# everything); a push to main and a manual run run everything. No secret and no AWS access: deployment is deploy.yml; real-data runs are pilot.yml.
on:
  # No paths filter: every change is classified by « Changed zones » (a docs/ file a test reads must run it).
  push:
    branches: [main, 'claude/v2-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A pull request's or main's newer run replaces the older one (a PR's diff is cumulative; main runs everything). A
# branch push or a manual run keeps its own run: a later push may need fewer suites than the one it would cancel.
concurrency:
  group: ci-${{ (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') && github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  changes:
    name: Changed zones
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      suites: ${{ steps.zones.outputs.suites }}
      site: ${{ steps.zones.outputs.site }}
      infra: ${{ steps.zones.outputs.infra }}
      image: ${{ steps.zones.outputs.image }}
      package: ${{ steps.zones.outputs.package }}
    steps:
      # A pull request's tested commit is its merge commit: its first parent is the base it was merged onto.
      - uses: actions/checkout@v7
        with: {fetch-depth: 2}
      # The changed files from git (both sides of a rename); a new branch, a forced push, a base git cannot fetch or
      # an empty list runs everything; a missing or malformed output fails the job.
      - id: zones
        env:
          FULL: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.event.forced == true }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          files="$RUNNER_TEMP/changed"
          if [ "$FULL" = true ]; then
            base=
          elif [ "$EVENT" = pull_request ]; then
            base=$(git rev-parse HEAD^1)
          elif [ -n "$BEFORE" ] && [ -n "${BEFORE//0/}" ] && git fetch --no-tags --depth=1 origin "$BEFORE"; then
            base=$BEFORE
          else
            base=
          fi
          if [ -n "$base" ] && git diff --name-only --no-renames -z "$base" HEAD > "$files" && [ -s "$files" ]; then
            echo "changed files since $base:"; tr '\0' '\n' < "$files" | sed -n '1,100p'
            zones=$(python3 backend/ci/changed_suites.py -z < "$files")
          else
            echo "every zone (main, manual run, forced or new branch, or no comparable base)"
            zones=$(python3 backend/ci/changed_suites.py --full)
          fi
          echo "$zones"
          grep -qE '^suites=\[("(python|deploy|api)",?)*\]$' <<< "$zones"
          for flag in site infra image package; do grep -qE "^$flag=(true|false)$" <<< "$zones"; done
          echo "$zones" >> "$GITHUB_OUTPUT"
  # One entry per part of the suites, side by side: python (backend/tests but the Deploy's), deploy (the Deploy's
  # end-to-end runs, test_deploy_flow.py: the real deploy.sh, BuildKit, the real migrations, about ten minutes), api
  # (the read API's and the account API's Node suites).
  suites:
    name: Suites (${{ matrix.suite }})
    needs: changes
    if: needs.changes.outputs.suites != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.changes.outputs.suites) }}
    services:
      postgres:
        # The base's engine (database.yaml: PostgreSQL 18), with pgvector for the optional migration.
        image: pgvector/pgvector:pg18
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: v2-ci-only, POSTGRES_DB: postgres}
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v7
      # test_deploy_flow.py starts from production's tree, e4014803 (git archive): that commit alone, not the history.
      - name: Production's commit for the Deploy's end-to-end runs
        if: matrix.suite == 'deploy'
        run: git fetch --no-tags --depth=1 origin e40148035927db988d854b0971856f1187fa09b4
      - uses: actions/setup-python@v7
        with: {python-version: '3.14'}
      - uses: actions/setup-node@v7
        with: {node-version: '24', package-manager-cache: false}
      - run: pip install -r backend/requirements.txt
      # The base preloads pg_stat_statements (database.yaml); the service's server does once restarted with it
      # (backend/tests/test_statement_statistics.py, FAILURE_MODES_OPTIMISATIONS.md GH171).
      - name: Preload pg_stat_statements as the base does
        run: |
          python -c "import psycopg; c = psycopg.connect('postgresql://postgres:v2-ci-only@127.0.0.1:5432/postgres', autocommit=True); c.execute(\"ALTER SYSTEM SET shared_preload_libraries = 'pg_stat_statements'\")"
          docker restart ${{ job.services.postgres.id }}
          for i in $(seq 1 60); do python -c "import psycopg, sys; c = psycopg.connect('postgresql://postgres:v2-ci-only@127.0.0.1:5432/postgres'); sys.exit(0 if 'pg_stat_statements' in c.execute('SHOW shared_preload_libraries').fetchone()[0] else 1)" && exit 0; sleep 2; done; exit 1
      - name: Disposable test databases
        run: python backend/ci/test_databases.py postgresql://postgres:v2-ci-only@127.0.0.1:5432 >> "$GITHUB_ENV"
      # Before the Python suites: their end-to-end tests read through the real API (pg). Under CI=true a missing
      # prerequisite fails them instead of skipping them (backend/tests/prerequisites.py).
      - name: Read API dependencies
        run: npm ci --prefix backend/api
      - name: Python suites
        if: matrix.suite != 'api'
        env:
          # GH171-l reads the server's own log (docker logs) of the service container (FAILURE_MODES_OPTIMISATIONS.md).
          VEGA_V2_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: python backend/ci/python_suites.py ${{ matrix.suite }}
      - name: Read API suites
        if: matrix.suite == 'api'
        run: npm test --prefix backend/api
      # The account tables are applied alone on their own database (backend/account/test/schema.test.mjs).
      - name: Account dependencies
        if: matrix.suite == 'api'
        run: npm ci --prefix backend/account
      - name: Account suites
        if: matrix.suite == 'api'
        run: npm test --prefix backend/account
  site:
    name: Site tests and build
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # The version dashboard/package.json names (packageManager): it wrote bun.lock.
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: '1.4.4'}
      - uses: actions/setup-node@v7
        with: {node-version: '26', package-manager-cache: false}
      - run: bun install --frozen-lockfile
        working-directory: dashboard
      - name: Site tests
        run: node --test tests/*.test.mjs
      - name: Site build
        run: bun run build
        working-directory: dashboard
        env:
          NEXT_PUBLIC_API_ORIGIN: https://dngp6kh9jx2bl.cloudfront.net
  infra:
    name: Infrastructure templates
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.14'}
      - run: pip install cfn-lint==1.43.0
      - run: cfn-lint --regions us-east-2 -- infra/aws/*.yaml
      # Alerts: the edge stack lives in us-east-1 (CloudFront and Route 53 metrics).
      - run: cfn-lint --regions us-east-1 -- infra/aws/alerts-edge.yaml
      # VI-35: the web ACL of CloudFront scope lives in us-east-1.
      - run: cfn-lint --regions us-east-1 -- infra/aws/waf.yaml
      # GH149: the distribution's access logs are delivered from us-east-1.
      - run: cfn-lint --regions us-east-1 -- infra/aws/edge-logs.yaml
      - name: Deploy state CLI with the runner system Python
        run: PYTHONPATH=backend:backend/tests /usr/bin/python3 -m unittest -v test_deploy_state
      - name: Deployment scripts parse
        run: bash -n infra/aws/deploy.sh && bash -n infra/aws/ci/secrets.sh
  image:
    name: Worker image (linux/arm64)
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build --platform linux/arm64 -f backend/Dockerfile -t vega-worker:${{ github.sha }} .
      - name: The image runs its tools
        run: |
          docker run --rm --entrypoint python vega-worker:${{ github.sha }} -c "import vega.worker, vega.archives, vega.migrate, vega.live.ingestor, boto3, botocore.auth"
          docker run --rm --entrypoint node vega-worker:${{ github.sha }} /app/backend/sources/bridge.mjs plans > /dev/null
          docker run --rm --entrypoint node vega-worker:${{ github.sha }} /app/backend/archives/edition.mjs - - > /dev/null
          # Every file a source adapter reads is where it looks for it in the image.
          docker run --rm --entrypoint python vega-worker:${{ github.sha }} -c "from vega.sources import curated, honours, wikidata; from vega import archives; import sys; missing = [str(p) for p in (curated.SHARED / 'league-rules.json', curated.SHARED / 'cup-logos.json', honours.SCRIPTS / 'player_honours.py', wikidata.BRIDGE, archives.EDITION, archives.TWINS) if not p.exists()]; sys.exit('missing: ' + ', '.join(missing) if missing else 0)"
          # The account's SQL files, where the migration task reads them (vega/migrate.py ACCOUNT_SQL).
          docker run --rm --entrypoint python vega-worker:${{ github.sha }} -c "from vega import migrate; import sys; names = sorted(p.name for p in migrate.ACCOUNT_SQL.glob('*.sql')); sys.exit(0 if names[:2] == ['001_accounts.sql', '002_account_api.sql'] else 'account SQL missing: ' + str(names))"
  api-package:
    name: Read API package
    needs: changes
    if: needs.changes.outputs.package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: '1.4.4'}
      - uses: actions/setup-node@v7
        with: {node-version: '24', package-manager-cache: false}
      - run: npm ci --prefix backend/api
      - run: python3 infra/aws/package_api.py "$RUNNER_TEMP/api"
      # GET /live/matches/{id}: its own function, the runtime's AWS SDK left out of the bundle.
      - run: python3 infra/aws/package_api.py "$RUNNER_TEMP/live" live
      # The account API's two functions (backend/account/FAILURE_MODES.md W13): each build runs its own offline check,
      # the front's 503 NOT_CONFIGURED and the store's NOT_CONFIGURED, on the bundled file.
      - run: npm ci --prefix backend/account
      - run: python3 infra/aws/package_api.py "$RUNNER_TEMP/account" account-front
      - run: python3 infra/aws/package_api.py "$RUNNER_TEMP/account" account-store
      - uses: actions/upload-artifact@v7
        with: {name: api-package, path: '${{ runner.temp }}/api/*.zip', retention-days: 14}
