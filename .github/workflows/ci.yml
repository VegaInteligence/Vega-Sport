name: CI
# Every suite of the backend, the infrastructure templates, the worker image, the read API
# package and the site's tests and build, on every change. No secret and no AWS access:
# deployment is deploy.yml; real-data runs are pilot.yml.
on:
  push:
    branches: [main, 'claude/v2-*']
    paths: ['backend/**', 'infra/aws/**', 'dashboard/**', 'tests/**', '.github/workflows/*.yml']
  pull_request:
    paths: ['backend/**', 'infra/aws/**', 'dashboard/**', 'tests/**', '.github/workflows/*.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: Python and API suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # The base's engine (database.yaml: PostgreSQL 18), with pgvector for the optional migration.
        image: pgvector/pgvector:pg18
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: v2-ci-only, POSTGRES_DB: postgres}
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pip install -r backend/requirements.txt
      - name: Disposable test databases
        run: python backend/ci/test_databases.py postgresql://postgres:v2-ci-only@127.0.0.1:5432 >> "$GITHUB_ENV"
      - name: Python suites
        run: python -m unittest discover -s backend/tests -v
      - name: Read API suites
        run: npm ci --prefix backend/api && npm test --prefix backend/api
  site:
    name: Site tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # The version dashboard/package.json names (packageManager): it wrote bun.lock.
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: '1.4.4'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: bun install --frozen-lockfile
        working-directory: dashboard
      # tests/known-failing.txt lists the test files that fail on the code as it is.
      - name: Site tests
        run: node --test $(ls tests/*.test.mjs | grep -v -x -F -f <(sed -e '/^#/d' -e '/^$/d' -e 's#^#tests/#' tests/known-failing.txt))
      - name: Site build
        run: bun run build
        working-directory: dashboard
        env:
          NEXT_PUBLIC_API_ORIGIN: https://dngp6kh9jx2bl.cloudfront.net
  infra:
    name: Infrastructure templates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install cfn-lint==1.43.0
      - run: cfn-lint --regions us-east-2 -- infra/aws/*.yaml
      - name: Deployment scripts parse
        run: bash -n infra/aws/deploy.sh && bash -n infra/aws/ci/secrets.sh
  image:
    name: Worker image (linux/arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build --platform linux/arm64 -f backend/Dockerfile -t vega-worker:${{ github.sha }} .
      - name: The image runs its tools
        run: |
          docker run --rm --entrypoint python vega-worker:${{ github.sha }} -c "import vega.worker, vega.archives, vega.migrate, vega.live.ingestor, boto3, botocore.auth"
          docker run --rm --entrypoint node vega-worker:${{ github.sha }} /app/backend/sources/bridge.mjs plans > /dev/null
          docker run --rm --entrypoint node vega-worker:${{ github.sha }} /app/backend/archives/edition.mjs - - > /dev/null
          # Every file a source adapter reads is where it looks for it in the image.
          docker run --rm --entrypoint python vega-worker:${{ github.sha }} -c "from vega.sources import curated, honours, wikidata; from vega import archives; import sys; missing = [str(p) for p in (curated.SHARED / 'league-rules.json', curated.SHARED / 'cup-logos.json', honours.SCRIPTS / 'player_honours.py', wikidata.BRIDGE, archives.EDITION) if not p.exists()]; sys.exit('missing: ' + ', '.join(missing) if missing else 0)"
  api-package:
    name: Read API package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: '1.2.21'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --prefix backend/api
      - run: python3 infra/aws/package_api.py "$RUNNER_TEMP/api"
      # GET /live/matches/{id}: its own function, the runtime's AWS SDK left out of the bundle.
      - run: python3 infra/aws/package_api.py "$RUNNER_TEMP/live" live
      - uses: actions/upload-artifact@v4
        with: {name: api-package, path: '${{ runner.temp }}/api/*.zip', retention-days: 14}
