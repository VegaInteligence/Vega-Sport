name: Isolated pilot
# Real PitchAPI data into a throwaway PostgreSQL 18 of the runner (the base's engine):
# the pilot collection, then the worker loop on the real J-1..J+7 calendars and the
# other sources. Measurements only leave the runner. The suites run in ci.yml.
on:
  push:
    branches: [main, 'claude/v2-*']
    paths: ['backend/**', '.github/workflows/pilot.yml']
  workflow_dispatch:
    inputs:
      max_matches:
        description: Finished Ligue 1 2025/26 matches (1 to 306)
        type: string
        default: '1'
# The provider key is read from SSM (/vega/v2/pitchapi-key) with the vega-v2-pilot role,
# which can read that parameter and nothing else; no GitHub secret.
permissions:
  contents: read
  id-token: write
concurrency:
  group: vega-v2-isolated-pilot
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-v2-only
          POSTGRES_DB: vega_v2_pilot
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: backend
      V2_DATABASE_URL: postgresql://postgres:isolated-v2-only@127.0.0.1:5432/vega_v2_pilot
    steps:
      - uses: actions/checkout@v4
        with:
          # The worker's sources run the site's readers (shared/, frontend services).
          sparse-checkout: |
            backend
            dashboard/shared
            dashboard/frontend/src
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: pip install -r backend/requirements.txt
      - name: AWS session (vega-v2-pilot, provider key only)
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: arn:aws:iam::361769570630:role/vega-v2-pilot
          aws-region: us-east-2
          role-duration-seconds: 900
      - name: Provider key from SSM, masked
        run: |
          key=$(aws ssm get-parameter --name /vega/v2/pitchapi-key --with-decryption --query Parameter.Value --output text)
          echo "::add-mask::$key"
          echo "PITCHAPI_API_KEY=$key" >> "$GITHUB_ENV"
      - name: Verify previously failing event, shot and upstream-error fixtures
        env:
          MATCH_INPUT: ${{ inputs.max_matches }}
        run: |
          scope="${MATCH_INPUT:-$(cat backend/pilot-scope.txt)}"
          if [ "$scope" = 306 ]; then
            python -m vega.pilot --ordinals 19,20,227,228 --max-matches 4 --profile-limit 2 --interval 0.25 --report work/vega-v2-regressions.md
          fi
      - name: Fresh PitchAPI collection into local PostgreSQL only
        env:
          MATCH_INPUT: ${{ inputs.max_matches }}
        run: |
          scope="${MATCH_INPUT:-$(cat backend/pilot-scope.txt)}"
          if python -m vega.pilot --max-matches "$scope" --resume --profile-limit 2 --interval 0.25 --report work/vega-v2-pilot-initial.md; then
            cp work/vega-v2-pilot-initial.md work/vega-v2-pilot.md
          else
            python -m vega.pilot --max-matches "$scope" --resume --profile-limit 2 --interval 0.25 --report work/vega-v2-pilot.md
          fi
      - name: Worker loop on the real J-1..J+7 calendars, local PostgreSQL only
        run: python -m vega.worker --max-jobs 700 --interval 0.25 --cohort-delay 0 --report work/vega-v2-worker.md
      - name: Export measurements only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vega-v2-pilot-measurements
          path: work/vega-v2-*.md
          if-no-files-found: warn
          retention-days: 14
