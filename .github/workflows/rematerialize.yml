name: Build serving tables (AWS)
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      schema_only:
        description: Install schemas without building business data
        type: boolean
        default: false
      home_only:
        description: Install schemas and refresh home projections without publishing business data
        type: boolean
        default: false
      queue_all:
        description: Requeue every published season (first run only)
        type: boolean
        default: false
      minutes:
        description: Maximum serving-table build minutes (1-100; job reserves 20 minutes for setup and commit)
        default: "100"
        required: true
      batch:
        description: Queue fetch size (each partition commits separately)
        default: "10"
        required: true
      lineup_reader:
        description: Optional lineup reader verification or reversible switch after installation
        type: choice
        options: [unchanged, verify, unified, legacy]
        default: unchanged
permissions:
  contents: read
concurrency:
  group: statarena-aws-ingestion
  cancel-in-progress: false
  queue: max
jobs:
  rematerialize:
    if: github.repository_id == '1441213700' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ vars.STATARENA_AWS_RUNNER || 'ubuntu-latest' }}
    env:
      STATARENA_SQL_LIMIT_BYTES: ${{ vars.STATARENA_SQL_LIMIT_BYTES }}
      STATARENA_SQL_RESERVE_BYTES: ${{ vars.STATARENA_SQL_RESERVE_BYTES }}
    timeout-minutes: ${{ github.event_name == 'schedule' && 50 || 120 }}
    steps:
      - name: Plan publication budget
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          MINUTES_INPUT: ${{ inputs.minutes }}
          BATCH_INPUT: ${{ inputs.batch }}
          HOME_ONLY_INPUT: ${{ inputs.home_only }}
          QUEUE_ALL_INPUT: ${{ inputs.queue_all }}
          SCHEMA_ONLY_INPUT: ${{ inputs.schema_only }}
          LINEUP_READER_INPUT: ${{ inputs.lineup_reader }}
        shell: bash
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            schedule)
              minutes=30
              batch=10
              home_only=false
              queue_all=false
              schema_only=false
              lineup_reader=unchanged
              ;;
            workflow_dispatch)
              minutes=${MINUTES_INPUT:-100}
              batch=${BATCH_INPUT:-10}
              home_only=${HOME_ONLY_INPUT:-false}
              queue_all=${QUEUE_ALL_INPUT:-false}
              schema_only=${SCHEMA_ONLY_INPUT:-false}
              lineup_reader=${LINEUP_READER_INPUT:-unchanged}
              ;;
            *) echo 'Unsupported publication trigger' >&2; exit 1 ;;
          esac
          if [[ ! "$minutes" =~ ^[1-9][0-9]{0,2}$ ]] || (( 10#$minutes > 100 )); then
            echo 'Build minutes must be between 1 and 100' >&2; exit 1
          fi
          if [[ ! "$batch" =~ ^[1-9][0-9]{0,2}$ ]] || (( 10#$batch > 100 )); then
            echo 'Queue batch must be between 1 and 100' >&2; exit 1
          fi
          case "$home_only:$queue_all:$schema_only" in
            true:false:false|false:true:true|false:true:false|false:false:true|false:false:false) ;;
            *) echo 'Publication flags must be true or false' >&2; exit 1 ;;
          esac
          if [ "$home_only" = true ] && [ "$lineup_reader" != unchanged ]; then
            echo 'Home-only cannot change the lineup reader' >&2; exit 1
          fi
          case "$lineup_reader" in
            unchanged|verify|unified|legacy) ;;
            *) echo 'Invalid lineup reader operation' >&2; exit 1 ;;
          esac
          {
            echo "home_only=$home_only"
            echo "minutes=$minutes"
            echo "batch=$batch"
            echo "queue_all=$queue_all"
            echo "schema_only=$schema_only"
            echo "lineup_reader=$lineup_reader"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            dashboard
            .github/actions/aws-database
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: dashboard/scripts/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
        working-directory: dashboard
      - run: pip install -r dashboard/scripts/requirements.txt
      - name: Load AWS staging credentials
        uses: ./.github/actions/aws-database
        with:
          mode: ingest
          role-arn: ${{ vars.STATARENA_AWS_INGEST_ROLE_ARN }}
      - name: Publish relational models in AWS RDS
        env:
          QUEUE_ALL: ${{ steps.plan.outputs.queue_all }}
          MATERIALIZE_MINUTES: ${{ steps.plan.outputs.minutes }}
          MATERIALIZE_BATCH: ${{ steps.plan.outputs.batch }}
          SCHEMA_ONLY: ${{ steps.plan.outputs.schema_only }}
          HOME_ONLY: ${{ steps.plan.outputs.home_only }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$MATERIALIZE_MINUTES" =~ ^[1-9][0-9]{0,2}$ ]] || (( 10#$MATERIALIZE_MINUTES > 100 )); then
            echo 'Build minutes must be between 1 and 100 within this 120-minute job' >&2; exit 1
          fi
          if [[ ! "$MATERIALIZE_BATCH" =~ ^[1-9][0-9]{0,2}$ ]] || (( 10#$MATERIALIZE_BATCH > 100 )); then
            echo 'Queue batch must be between 1 and 100' >&2; exit 1
          fi
          args=(--minutes "$MATERIALIZE_MINUTES" --batch "$MATERIALIZE_BATCH")
          if [ "$QUEUE_ALL" = "true" ]; then args+=(--all); fi
          if [ "$SCHEMA_ONLY" = "true" ] || [ "$HOME_ONLY" = "true" ]; then args+=(--install-only); fi
          python dashboard/scripts/relational_materialize.py "${args[@]}" | tee rematerialize.log
          if [ "$HOME_ONLY" = "true" ]; then
            node -e 'const s = require("node:fs").readFileSync("rematerialize.log", "utf8").trim().split("\n").at(-1); if (JSON.parse(s).schema_installed !== true) process.exit(1)'
          fi
      - name: Refresh home projections after publication
        if: steps.plan.outputs.schema_only != 'true' || steps.plan.outputs.home_only == 'true'
        continue-on-error: ${{ steps.plan.outputs.home_only != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          node dashboard/scripts/home_projection.mjs | tee home-projection.json
          if [ "${{ steps.plan.outputs.home_only }}" = true ]; then
            node -e 'const r = require("./home-projection.json"); if (r.scopes !== 2) process.exit(1)'
          fi
      - name: Verify or switch the lineup read contract
        if: steps.plan.outputs.lineup_reader != 'unchanged'
        env:
          LINEUP_READER: ${{ steps.plan.outputs.lineup_reader }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          case "$LINEUP_READER" in
            verify) ;;
            unified) args+=(--activate) ;;
            legacy) args+=(--rollback) ;;
            *) echo 'Invalid lineup reader operation' >&2; exit 1 ;;
          esac
          python dashboard/scripts/lineup_consolidation.py "${args[@]}" | tee lineup-contract.log
      - name: Save publication receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rematerialize-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            rematerialize.log
            lineup-contract.log
          if-no-files-found: ignore
