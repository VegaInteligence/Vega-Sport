name: Collect standings (AWS)
on:
  push:
    paths:
      - ".github/workflows/uefa-standings.yml"
      - "dashboard/frontend/src/services/uefa-standings.js"
      - "dashboard/frontend/src/services/standings-clubs.js"
      - "dashboard/frontend/src/components/CompetitionStandings.jsx"
      - "dashboard/scripts/aws_refresh_uefa_standings.mjs"
      - "tests/competition-render.test.mjs"
      - "tests/standings-clubs.test.mjs"
      - "tests/uefa-standings.test.mjs"
  schedule:
    - cron: "25 5 * * 2"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
        working-directory: dashboard
      - run: node --test tests/uefa-standings.test.mjs tests/standings-clubs.test.mjs tests/competition-render.test.mjs
      - run: node dashboard/scripts/aws_refresh_uefa_standings.mjs --check-source
  refresh:
    if: github.ref == 'refs/heads/main' && github.event_name != 'push'
    needs: verify
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: statarena-aws-ingestion
      cancel-in-progress: false
      queue: max
    runs-on: ${{ vars.STATARENA_AWS_RUNNER || 'ubuntu-latest' }}
    env:
      STATARENA_SQL_LIMIT_BYTES: ${{ vars.STATARENA_SQL_LIMIT_BYTES }}
      STATARENA_SQL_RESERVE_BYTES: ${{ vars.STATARENA_SQL_RESERVE_BYTES }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            dashboard
            .github/actions/aws-database
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
        working-directory: dashboard
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: dashboard/scripts/requirements.txt
      - run: pip install -r dashboard/scripts/requirements.txt
      - name: Load AWS staging credentials
        uses: ./.github/actions/aws-database
        with:
          mode: ingest
          role-arn: ${{ vars.STATARENA_AWS_INGEST_ROLE_ARN }}
      - run: node dashboard/scripts/aws_refresh_uefa_standings.mjs
      - name: Publish normalized RDS tables from staged data
        run: python dashboard/scripts/relational_materialize.py --minutes 15 --batch 10
      - name: Refresh home projections after publication
        continue-on-error: true
        run: node dashboard/scripts/home_projection.mjs
