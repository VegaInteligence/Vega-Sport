name: Deploy
# Deploys the backend: the base vega-football-db-postgres, its secrets, the worker and the
# backfill (migrations first), the read API and its distribution, and the account API once SSM
# /vega/v2/account-deploy is on (backend/account/DEPLOYMENT.md); with components worker, the worker
# and the backfill alone (infra/aws/README.md, Worker only). Manual only, from the
# v2-production environment, through the vega-v2-deploy role (deploy-roles.yaml).
on:
  workflow_dispatch:
    inputs:
      # VI-135: all, the whole backend (the default, as before); worker, the worker and the backfill alone on the commit's
      # image, when its migration files and the worker template are those deployed (infra/aws/README.md, Worker only).
      components:
        description: What to deploy (all, or the worker and the backfill alone)
        type: choice
        options: ['all', 'worker']
        default: 'all'
      # keep: the count a Deploy saved when it stopped the worker, else the stack's own (a worker stopped on purpose
      # stays so); 1 or 0 sets it (FAILURE_MODES_OPTIMISATIONS.md GH157-y).
      worker_desired_count:
        description: Worker count for a full Deploy. Worker mode keeps the deployed count.
        type: choice
        options: ['keep', '1', '0']
        default: 'keep'
      import_archives:
        description: Run the historical archive import (sources in the release bucket, data/sources/)
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
  # A Deploy whose state another run holds asks GitHub whether that run has ended (GH157.3): gh api …/attempts/<n>.
  actions: read
concurrency:
  group: vega-v2-deploy
  cancel-in-progress: false
env:
  AWS_REGION: us-east-2
  CFN_ROLE: arn:aws:iam::361769570630:role/vega-v2-cloudformation
jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    environment: v2-production
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      # The commit goes on only once ci.yml's newest run for it on main (a push or a manual run) completed green;
      # anything else stops the job here, before any AWS credential (FAILURE_MODES_OPTIMISATIONS.md GH196).
      - name: Full CI green for this commit (infra/aws/ci/check_deploy_ci.py)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 infra/aws/ci/check_deploy_ci.py
      - name: AWS session (vega-v2-deploy)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::361769570630:role/vega-v2-deploy
          aws-region: us-east-2
          role-duration-seconds: 7200
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: '1.4.4'}
      - uses: actions/setup-node@v7
        with: {node-version: '24', package-manager-cache: false}
      - name: Deploy (infra/aws/deploy.sh)
        env:
          CFN_ROLE: ${{ env.CFN_ROLE }}
          IMAGE_TAG: ${{ github.sha }}
          DEPLOY_COMPONENTS: ${{ inputs.components }}
          WORKER_DESIRED_COUNT: ${{ inputs.worker_desired_count }}
          IMPORT_ARCHIVES: ${{ inputs.import_archives }}
          ARCHIVE_SOURCES_BUCKET: ${{ vars.V2_ARCHIVE_SOURCES_BUCKET }}
          PITCHAPI_API_KEY: ${{ inputs.components != 'worker' && secrets.PITCHAPI_API_KEY || '' }}
          # The live provider's adapter (backend/vega/live/adapters.py); unset, the live ingestor stays off.
          LIVE_PROVIDER: ${{ vars.V2_LIVE_PROVIDER }}
          # gh's token (actions: read only), to ask whether the run holding the Deploy's state has ended.
          GH_TOKEN: ${{ github.token }}
          SMOKE_PUBLIC_SEASON: ${{ vars.V2_PUBLIC_SMOKE_SEASON }}
          SMOKE_PUBLIC_TEAMS: ${{ vars.V2_PUBLIC_SMOKE_TEAMS }}
        # pipefail: the step fails when the script does, not when tee does (it never does).
        run: set -o pipefail; bash infra/aws/deploy.sh | tee -a "$GITHUB_STEP_SUMMARY"
