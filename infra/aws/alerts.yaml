AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Vega alerts in the deploy's region: the topic vega-v2-alerts and its e-mail subscription,
  and the alarms of the read API's function, the database and the worker. The alarms on the
  distribution and the outside probe are in alerts-edge.yaml (us-east-1, where CloudFront
  and Route 53 metrics exist). Every alarm says ALARM and OK to the topic
  (backend/tests/test_alerts.py). On 20 November 2026 the API refused every read for hours
  and no one was told (VI-33).
Parameters:
  AlertEmail:
    Type: String
    NoEcho: true
    Default: ''
    AllowedPattern: '([^@\s]+@[^@\s]+\.[^@\s]+)?'
    Description: 'Where the alerts go: deploy.sh reads it from SSM /vega/v2/alert-email; empty, the topic has no subscription'
  # Two people run the service: the SSM parameter may hold a second address after a comma.
  AlertEmail2:
    Type: String
    NoEcho: true
    Default: ''
    AllowedPattern: '([^@\s]+@[^@\s]+\.[^@\s]+)?'
    Description: 'A second address for the same alerts (the part after the comma in SSM /vega/v2/alert-email); empty, the first one only'
  WatchWorker:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: 'false while the worker is stopped on purpose (deploy.sh: WORKER_DESIRED_COUNT=0): no alarm for a service meant to be off'
  # GH204: true while the backfill is meant to run (deploy.sh: its count is 1): its absence and its restarts are alarms.
  WatchBackfill:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: 'true while the backfill service is set to 1 (deploy.sh): an alarm when it does not run or restarts in a loop'
  WatchLive:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: 'true once a live provider is chosen (deploy.sh: LIVE_PROVIDER): until then, no alarm and no cost for the live circuit'
  # true once SSM /vega/v2/account-deploy is on (deploy.sh), then kept: the account's login counts.
  Account:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: 'true: the connections alarm counts the account login vega_v2_account (18 connections)'
Conditions:
  HasEmail: !Not [!Equals [!Ref AlertEmail, '']]
  HasEmail2: !Not [!Equals [!Ref AlertEmail2, '']]
  Worker: !Equals [!Ref WatchWorker, 'true']
  Backfill: !Equals [!Ref WatchBackfill, 'true']
  Live: !Equals [!Ref WatchLive, 'true']
  Account: !Equals [!Ref Account, 'true']
Resources:
  Topic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: vega-v2-alerts
      DisplayName: Vega alerts
      Tags: [{Key: project, Value: vega-v2}]
  # The owner confirms it once from the e-mail AWS sends (README, Alerts); until then the
  # topic delivers nothing.
  EmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasEmail
    Properties:
      TopicArn: !Ref Topic
      Protocol: email
      Endpoint: !Ref AlertEmail
  # Each address confirms on its own, from its own e-mail.
  EmailSubscription2:
    Type: AWS::SNS::Subscription
    Condition: HasEmail2
    Properties:
      TopicArn: !Ref Topic
      Protocol: email
      Endpoint: !Ref AlertEmail2

  # --- The read API's function (api.yaml: vega-v2-api, 32 copies, 25 s) ---------------
  # Errors are what the handler did not catch: a crash, a timeout, memory. A database
  # error is not one (the handler answers 503): the log filters below count those.
  ApiErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: vega-v2-api-errors
      AlarmDescription: vega-v2-api failed 5 times or more in each of 2 of the last 3 five-minute periods (crash, timeout or memory, not a 503)
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: vega-v2-api}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Topic]
      OKActions: [!Ref Topic]
  # Requests Lambda refused because the 32 copies were all busy (429; the site asks again).
  # A burst of a page's reads gives a few; 20 in each of two periods is a lasting shortage.
  ApiThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: vega-v2-api-throttles
      AlarmDescription: vega-v2-api refused 20 requests or more (all its copies busy) in each of 2 five-minute periods
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions: [{Name: FunctionName, Value: vega-v2-api}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 20
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Topic]
      OKActions: [!Ref Topic]
  # Before the refusals: 90 % of the copies (ceil(0.9 x 32) = 29) in use for 15 minutes.
  ApiCopiesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: vega-v2-api-copies
      AlarmDescription: 29 of the 32 copies of vega-v2-api or more ran at once in each of 3 five-minute periods (README, The read API's connections)
      Namespace: AWS/Lambda
      MetricName: ConcurrentExecutions
      Dimensions: [{Name: FunctionName, Value: vega-v2-api}]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 29
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Topic]
      OKActions: [!Ref Topic]
  # 80 % of the function's 25 s. A statement stops at 8 s (db.mjs), so answers that long
  # wait on something else: connections, the base's processors, compression. p90, not
  # the maximum: one slow read at night is not an alarm.
  ApiSlowAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: vega-v2-api-slow
      AlarmDescription: The slowest tenth of vega-v2-api's answers took 20 s or more (its limit is 25 s) for 15 minutes
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions: [{Name: FunctionName, Value: vega-v2-api}]
      ExtendedStatistic: p90
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 20000
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Topic]
      OKActions: [!Ref Topic]
  # `read failed <code> <path>` (backend/api/src/handler.mjs), as Lambda's text format writes
  # it: `<time>\t<request id>\tERROR\tread failed 53300 /api/...`. Counted: the base refuses
  # or cannot be reached: 53xxx (out of resources, 53300 too many connections: VI-33),
  # 57P01-57P03 (shut down, starting), 08xxx (connection), 28xxx (login), and Node's
  # ECONNREFUSED, ETIMEDOUT, ENOTFOUND. Not counted: a statement that ran too long (57014),
  # which the 5xx filter sees. %regex%: a space and a quote are not in its character set,
  # hence \x20 and \x22; no parentheses (CloudWatch Logs, filter pattern syntax).
  DatabaseRefusedFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: /aws/lambda/vega-v2-api
      FilterPattern: '%failed\x2053[0-9A-Z]{3}\x20|failed\x2057P0[123]\x20|failed\x2008[0-9A-Z]{3}\x20|failed\x2028[0-9A-Z]{3}\x20|failed\x20ECONNREFUSED\x20|failed\x20ETIMEDOUT\x20|failed\x20ENOTFOUND\x20%'
      MetricTransformations:
        - {MetricNamespace: Vega/Api, MetricName: DatabaseRefused, MetricValue: '1', DefaultValue: 0, Unit: Count}
  DatabaseRefusedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: vega-v2-api-db-refused
      AlarmDescription: The base refused or could not be reached on 5 reads or more of vega-v2-api in five minutes (read failed 53300, 57P03, 08..., ECONNREFUSED)
      Namespace: Vega/Api
      MetricName: DatabaseRefused
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Topic]
      OKActions: [!Ref Topic]
  # The line of each request (handler.mjs): `{"request":"read",...,"status":503,...}`.
  # Answers the distribution serves from its copy (stale-if-error) are not in it: these
  # are the 5xx the function gave, before the distribution hides some of them.
  Responses5xxFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: /aws/lambda/vega-v2-api
      FilterPattern: '%\x22status\x22:5[0-9][0-9],%'
      MetricTransformations:
        - {MetricNamespace: Vega/Api, MetricName: Responses5xx, MetricValue: '1', DefaultValue: 0, Unit: Count}
  Responses5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: vega-v2-api-5xx
      AlarmDescription: vega-v2-api answered 10 errors (5xx) or more in each of 2 five-minute periods
      Namespace: Vega/Api
      MetricName: Responses5xx
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Topic]
      OKActions: [!Ref Topic]

  # GH204 (FAILURE_MODES_OPTIMISATIONS.md): a slowing long before the 20 s of vega-v2-api-slow, for the whole function
  # (a percentile: it holds whatever the traffic).
  ApiP95Alarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: vega-v2-api-p95
      AlarmDescription: The slowest twentieth of vega-v2-api's answers took 3 s or more for 30 minutes (6 five-minute periods)
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions: [{Name: FunctionName, Value: vega-v2-api}]
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 6
      DatapointsToAlarm: 6
      Threshold: 3000
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Topic]
      OKActions: [!Ref Topic]
  # GH204: one route failing for its visitors (GH #220: 133 of 168 calls of /api/read/home-favourites in 503 while the
  # function's total stayed under vega-v2-api-5xx's 10). The request lines are JSON lines of their own
  # (infra/aws/api-index.mjs) naming their route (src/route-family.mjs, identifiers written id): one rule counts the 5xx
  # answers by route, whatever the routes; the alarm reads the route with the most in each period.
  RouteErrorsRule:
    Type: AWS::CloudWatch::InsightRule
    Properties:
      RuleName: vega-v2-api-route-5xx
      RuleState: ENABLED
      RuleBody: '{"Schema":{"Name":"CloudWatchLogRule","Version":1},"LogGroupNames":["/aws/lambda/vega-v2-api"],"LogFormat":"JSON","Contribution":{"Keys":["$.route"],"Filters":[{"Match":"$.request","In":["read"]},{"Match":"$.status","GreaterThan":499}]},"AggregateOn":"Count"}'
      Tags: [{Key: project, Value: vega-v2}]
  RouteErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: RouteErrorsRule
    Properties:
      AlarmName: vega-v2-api-route-5xx
      AlarmDescription: One route of vega-v2-api answered 2 errors (5xx) or more in each of 3 five-minute periods (Contributor Insights rule vega-v2-api-route-5xx names it)
      Metrics:
        - Id: route
          Label: 5xx of the route with the most
          ReturnData: true
          Expression: "INSIGHT_RULE_METRIC('vega-v2-api-route-5xx', 'MaxContributorValue')"
          Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 2
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Topic]
      OKActions: [!Ref Topic]

  # --- The database (database.yaml: vega-football-db-postgres) -------------------------
  # The first three were in database.yaml until 23 November 2026, with no action.
  DatabaseLowMemoryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: vega-v2-db-low-memory
      AlarmDescription: Under 300 MB freeable on vega-football-db-postgres for 15 minutes
      Namespace: AWS/RDS
      MetricName: FreeableMemory
      Dimensions: [{Name: DBInstanceIdentifier, Value: vega-football-db-postgres}]
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 3
      Threshold: 314572800
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Topic]
      OKActions: [!Ref Topic]
  DatabaseLowStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: vega-v2-db-low-storage
      AlarmDescription: Under 3 GB free storage on vega-football-db-postgres (autoscaling up to MaxAllocatedStorage)
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions: [{Name: DBInstanceIdentifier, Value: vega-football-db-postgres}]
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3221225472
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Topic]
      OKActions: [!Ref Topic]
  DatabaseHighCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: vega-v2-db-high-cpu
      AlarmDescription: Over 90 % CPU on vega-football-db-postgres for 30 minutes
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions: [{Name: DBInstanceIdentifier, Value: vega-football-db-postgres}]
      Statistic: Average
      Period: 300
      EvaluationPeriods: 6
      Threshold: 90
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Topic]
      OKActions: [!Ref Topic]
  # The three logins together hold at most 78 connections (vega/migrate.py: collect 6,
  # calc 4, read 68), 96 with the account's (18) once the account is on; owner's margin: 10
  # (migrations, a psql session, RDS's own). Above 88 (106) for 15 minutes, something holds
  # connections no login limit bounds (the owner's),
  # long before the instance's ~400 run out. The read login's own limit shows as
  # vega-v2-api-db-refused (53300), not here: the metric counts all logins together.
  DatabaseConnectionsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: vega-v2-db-connections
      AlarmDescription: !If [Account, "More than the logins' 96 connections plus 10 on vega-football-db-postgres for 15 minutes",
                             "More than the logins' 78 connections plus 10 on vega-football-db-postgres for 15 minutes"]
      Namespace: AWS/RDS
      MetricName: DatabaseConnections
      Dimensions: [{Name: DBInstanceIdentifier, Value: vega-football-db-postgres}]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: !If [Account, 106, 88]
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Topic]
      OKActions: [!Ref Topic]

  # --- The worker (worker.yaml: cluster vega-v2, service vega-v2-worker) ---------------
  # Without Container Insights (off in worker.yaml) ECS still sends the service's CPU each
  # minute, and only while a task runs: no sample for 15 minutes is a worker that does not
  # run (a deploy stops it for a few minutes only). A task that restarts in a loop still
  # sends some samples: its errors are in /ecs/vega-v2-worker, not here.
  WorkerDownAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: Worker
    Properties:
      AlarmName: vega-v2-worker-down
      AlarmDescription: No task of the collection service vega-v2-worker ran for 15 minutes
      Namespace: AWS/ECS
      MetricName: CPUUtilization
      Dimensions: [{Name: ClusterName, Value: vega-v2}, {Name: ServiceName, Value: vega-v2-worker}]
      Statistic: SampleCount
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref Topic]
      OKActions: [!Ref Topic]

  # GH204: a service's task stopped by its container or failing to start, three times in 30 minutes: a restart loop the
  # CPU samples above do not show. A deploy, a lowered count (ServiceSchedulerInitiated), a stop by hand (UserInitiated)
  # and AWS's maintenance are not counted. The rule has no target: the alarm reads its MatchedEvents.
  WorkerStopsRule:
    Type: AWS::Events::Rule
    Condition: Worker
    Properties:
      Name: vega-v2-worker-stops
      Description: vega-v2-worker's tasks stopped by their container or failing to start (alerts.yaml, GH204)
      State: ENABLED
      EventPattern: '{"source":["aws.ecs"],"detail-type":["ECS Task State Change"],"detail":{"group":["service:vega-v2-worker"],"lastStatus":["STOPPED"],"stopCode":["EssentialContainerExited","TaskFailedToStart"]}}'
  WorkerRestartsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: Worker
    Properties:
      AlarmName: vega-v2-worker-restarts
      AlarmDescription: A task of vega-v2-worker stopped by itself or failed to start 3 times or more in 30 minutes (EventBridge rule vega-v2-worker-stops)
      Namespace: AWS/Events
      MetricName: MatchedEvents
      Dimensions: [{Name: RuleName, Value: vega-v2-worker-stops}]
      Statistic: Sum
      Period: 1800
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Topic]
      OKActions: [!Ref Topic]
  BackfillStopsRule:
    Type: AWS::Events::Rule
    Condition: Backfill
    Properties:
      Name: vega-v2-backfill-stops
      Description: vega-v2-backfill's tasks stopped by their container or failing to start (alerts.yaml, GH204)
      State: ENABLED
      EventPattern: '{"source":["aws.ecs"],"detail-type":["ECS Task State Change"],"detail":{"group":["service:vega-v2-backfill"],"lastStatus":["STOPPED"],"stopCode":["EssentialContainerExited","TaskFailedToStart"]}}'
  BackfillRestartsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: Backfill
    Properties:
      AlarmName: vega-v2-backfill-restarts
      AlarmDescription: A task of vega-v2-backfill stopped by itself or failed to start 3 times or more in 30 minutes (EventBridge rule vega-v2-backfill-stops)
      Namespace: AWS/Events
      MetricName: MatchedEvents
      Dimensions: [{Name: RuleName, Value: vega-v2-backfill-stops}]
      Statistic: Sum
      Period: 1800
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Topic]
      OKActions: [!Ref Topic]
  # The backfill meant to run (WatchBackfill: deploy.sh set it to 1) that does not, as vega-v2-worker-down.
  BackfillDownAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: Backfill
    Properties:
      AlarmName: vega-v2-backfill-down
      AlarmDescription: No task of vega-v2-backfill ran for 15 minutes while the Deploy set it to run
      Namespace: AWS/ECS
      MetricName: CPUUtilization
      Dimensions: [{Name: ClusterName, Value: vega-v2}, {Name: ServiceName, Value: vega-v2-backfill}]
      Statistic: SampleCount
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref Topic]
      OKActions: [!Ref Topic]

  # --- Live (live.yaml), only once a provider is chosen --------------------------------
  LiveReadErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: Live
    Properties:
      AlarmName: vega-v2-live-read-errors
      AlarmDescription: vega-v2-live-read failed 5 times or more in each of 2 of the last 3 five-minute periods
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: vega-v2-live-read}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Topic]
      OKActions: [!Ref Topic]
  # GH204: one page of what the alarms watch (the first three dashboards are free).
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: vega-v2
      DashboardBody: !Sub
        - |
          {"widgets":[
           {"type":"metric","x":0,"y":0,"width":12,"height":6,"properties":{"title":"Read API: requests, errors, refusals","region":"${AWS::Region}","stat":"Sum","period":300,
            "metrics":[["AWS/Lambda","Invocations","FunctionName","vega-v2-api"],[".","Errors",".","."],[".","Throttles",".","."],["Vega/Api","Responses5xx"],[".","DatabaseRefused"]]}},
           {"type":"metric","x":12,"y":0,"width":12,"height":6,"properties":{"title":"Read API: duration (ms) and copies","region":"${AWS::Region}","period":300,
            "metrics":[["AWS/Lambda","Duration","FunctionName","vega-v2-api",{"stat":"p50"}],["...",{"stat":"p95"}],["...",{"stat":"p99"}],[".","ConcurrentExecutions",".",".",{"stat":"Maximum","yAxis":"right"}]]}},
           {"type":"metric","x":0,"y":6,"width":12,"height":6,"properties":{"title":"Routes in 5xx (vega-v2-api-route-5xx)","region":"${AWS::Region}","period":300,
            "insightRule":{"maxContributorCount":10,"orderBy":"Sum","ruleName":"vega-v2-api-route-5xx"},"legend":{"position":"bottom"},"view":"timeSeries"}},
           {"type":"log","x":12,"y":6,"width":12,"height":6,"properties":{"title":"95th percentile by route (ms)","region":"${AWS::Region}","view":"table",
            "query":"SOURCE '/aws/lambda/vega-v2-api' | fields route, ms | filter request = 'read' | stats pct(ms, 95) by route | sort route"}},
           {"type":"metric","x":0,"y":12,"width":12,"height":6,"properties":{"title":"Worker and backfill: tasks running (CPU samples), abnormal stops","region":"${AWS::Region}","period":300,
            "metrics":[["AWS/ECS","CPUUtilization","ClusterName","vega-v2","ServiceName","vega-v2-worker",{"stat":"SampleCount"}],["...","vega-v2-backfill",{"stat":"SampleCount"}],
             ["AWS/Events","MatchedEvents","RuleName","vega-v2-worker-stops",{"stat":"Sum","yAxis":"right"}],["...","vega-v2-backfill-stops",{"stat":"Sum","yAxis":"right"}]]}},
           {"type":"metric","x":12,"y":12,"width":12,"height":6,"properties":{"title":"Base: CPU, connections, freeable memory","region":"${AWS::Region}","period":300,
            "metrics":[["AWS/RDS","CPUUtilization","DBInstanceIdentifier","vega-football-db-postgres",{"stat":"Average"}],[".","DatabaseConnections",".",".",{"stat":"Maximum","yAxis":"right"}],[".","FreeableMemory",".",".",{"stat":"Minimum","yAxis":"right"}]]}},
           {"type":"metric","x":0,"y":18,"width":12,"height":6,"properties":{"title":"Distribution (us-east-1): requests and 5xx rate","region":"us-east-1","period":300,
            "metrics":[[{"expression":"SEARCH('{AWS/CloudFront,DistributionId,Region} MetricName=\"Requests\"', 'Sum', 300)","id":"requests"}],
             [{"expression":"SEARCH('{AWS/CloudFront,DistributionId,Region} MetricName=\"5xxErrorRate\"', 'Average', 300)","id":"errors","yAxis":"right"}]]}},
           {"type":"alarm","x":12,"y":18,"width":12,"height":6,"properties":{"title":"Alarms","alarms":["${Errors}","${Throttles}","${Copies}","${Slow}","${P95}","${Five}","${Route}","${Refused}","${Memory}","${Storage}","${Cpu}","${Connections}"]}}
          ]}
        - Errors: !GetAtt ApiErrorsAlarm.Arn
          Throttles: !GetAtt ApiThrottlesAlarm.Arn
          Copies: !GetAtt ApiCopiesAlarm.Arn
          Slow: !GetAtt ApiSlowAlarm.Arn
          P95: !GetAtt ApiP95Alarm.Arn
          Five: !GetAtt Responses5xxAlarm.Arn
          Route: !GetAtt RouteErrorsAlarm.Arn
          Refused: !GetAtt DatabaseRefusedAlarm.Arn
          Memory: !GetAtt DatabaseLowMemoryAlarm.Arn
          Storage: !GetAtt DatabaseLowStorageAlarm.Arn
          Cpu: !GetAtt DatabaseHighCpuAlarm.Arn
          Connections: !GetAtt DatabaseConnectionsAlarm.Arn
Outputs:
  TopicArn: {Value: !Ref Topic, Export: {Name: vega-v2-alerts-topic}}
