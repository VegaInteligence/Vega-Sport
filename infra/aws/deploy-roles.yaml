AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Roles of the deployment workflow (.github/workflows/deploy.yml). The workflow
  assumes vega-v2-deploy through the existing GitHub OIDC provider, only from the
  v2-production environment of this repository; CloudFormation changes the vega-v2-*
  stacks with vega-v2-cloudformation, limited to their resources.
Parameters:
  GitHubSubject:
    Type: String
    Default: 'repo:VegaInteligence@188998341/Vega-Sport@1441213700:environment:v2-production'
    Description: OIDC subject (immutable ids, as the current roles use them)
  ReleaseBucket:
    Type: String
    Default: vega-v2-releases-361769570630-us-east-2
Resources:
  CloudFormationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: vega-v2-cloudformation
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: cloudformation.amazonaws.com}, Action: 'sts:AssumeRole'}]
      # The two buckets (CloudFormationBuckets, below): a policy of their own.
      ManagedPolicyArns: [!Ref CloudFormationBuckets]
      Policies:
        - PolicyName: V2Stacks
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Database
                Effect: Allow
                Action: ['rds:*']
                Resource:
                  - !Sub 'arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:db:vega-football-db-postgres'
                  - !Sub 'arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:subgrp:vega-v2-*'
                  - !Sub 'arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:pg:vega-v2-*'
                  - !Sub 'arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:snapshot:vega-football-db-postgres-*'
              - Sid: DatabaseDescribe
                Effect: Allow
                Action: ['rds:Describe*', 'rds:ListTagsForResource', 'ec2:Describe*', 'secretsmanager:CreateSecret', 'secretsmanager:TagResource',
                         'secretsmanager:DescribeSecret', 'secretsmanager:RotateSecret', 'secretsmanager:PutSecretValue', 'kms:DescribeKey',
                         'kms:CreateGrant', 'kms:Decrypt', 'kms:GenerateDataKey']
                Resource: '*'
              - Sid: SecurityGroups
                Effect: Allow
                Action: ['ec2:CreateSecurityGroup', 'ec2:DeleteSecurityGroup', 'ec2:AuthorizeSecurityGroupIngress', 'ec2:AuthorizeSecurityGroupEgress',
                         'ec2:RevokeSecurityGroupIngress', 'ec2:RevokeSecurityGroupEgress', 'ec2:CreateTags', 'ec2:DeleteTags']
                Resource: '*'
                Condition: {StringEquals: {'ec2:Vpc': !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc/vpc-08e400afa07fc1812'}}
              # ec2:CreateSecurityGroup is authorized on the group and on the VPC, and ec2:Vpc is set for
              # neither: both are named here (backend/account/FAILURE_MODES.md W14, Deploy 132).
              - Sid: SecurityGroupCreate
                Effect: Allow
                Action: ['ec2:CreateSecurityGroup', 'ec2:CreateTags']
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*'
                  - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:vpc/vpc-08e400afa07fc1812'
              - Sid: Containers
                Effect: Allow
                Action: ['ecr:*']
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/vega-v2-worker'
              - Sid: Ecs
                Effect: Allow
                Action: ['ecs:CreateCluster', 'ecs:DeleteCluster', 'ecs:DescribeClusters', 'ecs:UpdateClusterSettings', 'ecs:TagResource',
                         'ecs:RegisterTaskDefinition', 'ecs:DeregisterTaskDefinition', 'ecs:DescribeTaskDefinition', 'ecs:CreateService',
                         'ecs:UpdateService', 'ecs:DeleteService', 'ecs:DescribeServices', 'ecs:ListTagsForResource']
                Resource: '*'
              - Sid: Logs
                Effect: Allow
                Action: ['logs:*']
                Resource:
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/vega-v2-worker*'
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/vega-v2-api*'
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/vega-v2-live*'
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/vega-v2-live*'
                  # VI-38: the account API (account.yaml), its two functions' log groups.
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/vega-v2-account*'
                  # GH171: the PostgreSQL log the base exports (database.yaml PostgresqlLog, 14 days).
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/rds/instance/vega-football-db-postgres/postgresql*'
                  # GH149: the distribution's access logs (edge-logs.yaml AccessLog, us-east-1, 14 days).
                  - !Sub 'arn:${AWS::Partition}:logs:us-east-1:${AWS::AccountId}:log-group:vega-v2-api-access*'
              - Sid: LogsDescribe
                Effect: Allow
                Action: ['logs:DescribeLogGroups']
                Resource: '*'
              - Sid: Roles
                Effect: Allow
                Action: ['iam:CreateRole', 'iam:DeleteRole', 'iam:GetRole', 'iam:PassRole', 'iam:PutRolePolicy', 'iam:DeleteRolePolicy',
                         'iam:GetRolePolicy', 'iam:AttachRolePolicy', 'iam:DetachRolePolicy', 'iam:TagRole', 'iam:UpdateAssumeRolePolicy',
                         'iam:ListRolePolicies', 'iam:ListAttachedRolePolicies']
                Resource:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/vega-v2-worker-*'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/vega-v2-api-*'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/vega-v2-live-*'
                  # VI-38: CloudFormation names them vega-v2-account-<Id>-<random>.
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/vega-v2-account-*'
              - Sid: ServiceLinkedRoles
                Effect: Allow
                Action: 'iam:CreateServiceLinkedRole'
                Resource: '*'
                Condition: {StringEquals: {'iam:AWSServiceName': ['ecs.amazonaws.com', 'rds.amazonaws.com']}}
              - Sid: Functions
                Effect: Allow
                Action: ['lambda:*']
                Resource:
                  - !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:vega-v2-api*'
                  - !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:vega-v2-live*'
                  # VI-38: the front (its Function URL and its public permissions included) and the store.
                  - !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:vega-v2-account*'
              - Sid: ReleaseRead
                Effect: Allow
                Action: ['s3:GetObject']
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${ReleaseBucket}/releases/v2-api/*'
                  - !Sub 'arn:${AWS::Partition}:s3:::${ReleaseBucket}/releases/v2-live/*'
                  - !Sub 'arn:${AWS::Partition}:s3:::${ReleaseBucket}/releases/v2-account/*'
              # Live (live.yaml): its tables and its AppSync Events API.
              - Sid: LiveTables
                Effect: Allow
                Action: ['dynamodb:*']
                Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/vega-v2-live-*'
              - Sid: LiveEvents
                Effect: Allow
                Action: ['appsync:*']
                Resource: !Sub 'arn:${AWS::Partition}:appsync:${AWS::Region}:${AWS::AccountId}:apis/*'
              # Creating an API, and the actions on its keys (the browser key is renewed on each
              # deploy), are not granted per resource: IAM only takes '*' for them.
              - Sid: LiveEventsCreate
                Effect: Allow
                Action: ['appsync:CreateApi', 'appsync:TagResource', 'appsync:ListApis',
                         'appsync:CreateApiKey', 'appsync:UpdateApiKey', 'appsync:DeleteApiKey', 'appsync:ListApiKeys']
                Resource: '*'
              # The alarms of this region (alerts.yaml; database.yaml's until 23 November 2026).
              - Sid: DatabaseAlarms
                Effect: Allow
                Action: ['cloudwatch:PutMetricAlarm', 'cloudwatch:DeleteAlarms', 'cloudwatch:DescribeAlarms', 'cloudwatch:TagResource',
                         'cloudwatch:UntagResource', 'cloudwatch:ListTagsForResource']
                Resource: !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:vega-v2-*'
              # --- Alerts (alerts.yaml here, alerts-edge.yaml in us-east-1: CloudFront and Route 53
              # metrics exist only there). The topic and its e-mail subscription in both regions
              # (a subscription's ARN is the topic's plus an id), the alarms of us-east-1 (those
              # of this region are DatabaseAlarms), the API log's metric filters (Logs, above),
              # and the outside probe: a health check has no name to scope by, and its creation
              # takes no resource.
              - Sid: AlertTopics
                Effect: Allow
                Action: ['sns:CreateTopic', 'sns:DeleteTopic', 'sns:GetTopicAttributes', 'sns:SetTopicAttributes', 'sns:TagResource',
                         'sns:UntagResource', 'sns:ListTagsForResource', 'sns:ListSubscriptionsByTopic', 'sns:GetDataProtectionPolicy',
                         'sns:PutDataProtectionPolicy', 'sns:Subscribe', 'sns:Unsubscribe', 'sns:GetSubscriptionAttributes',
                         'sns:SetSubscriptionAttributes']
                Resource:
                  - !Sub 'arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:vega-v2-alerts*'
                  - !Sub 'arn:${AWS::Partition}:sns:us-east-1:${AWS::AccountId}:vega-v2-alerts*'
              # IAM knows no subscription resource: these three match no ARN, the topic's
              # included (simulate-principal-policy, 23 November 2026), so they are granted on *.
              - Sid: AlertSubscriptions
                Effect: Allow
                Action: ['sns:GetSubscriptionAttributes', 'sns:SetSubscriptionAttributes', 'sns:Unsubscribe']
                Resource: '*'
              - Sid: AlertTopicsList
                Effect: Allow
                Action: ['sns:ListTopics']
                Resource: '*'
              - Sid: EdgeAlarms
                Effect: Allow
                Action: ['cloudwatch:PutMetricAlarm', 'cloudwatch:DeleteAlarms', 'cloudwatch:DescribeAlarms', 'cloudwatch:TagResource',
                         'cloudwatch:UntagResource', 'cloudwatch:ListTagsForResource']
                Resource: !Sub 'arn:${AWS::Partition}:cloudwatch:us-east-1:${AWS::AccountId}:alarm:vega-v2-*'
              - Sid: HealthCheck
                Effect: Allow
                Action: ['route53:CreateHealthCheck', 'route53:GetHealthCheck', 'route53:UpdateHealthCheck', 'route53:DeleteHealthCheck',
                         'route53:ChangeTagsForResource', 'route53:ListTagsForResource', 'route53:ListHealthChecks']
                Resource: '*'
              # GH204: the dashboard, the rule counting the 5xx by route, the rules of the services' abnormal stops.
              # The dashboard's handler also tags it and reads its tags back (GH204-e, AWS::CloudWatch::Dashboard's
              # schema): on that dashboard's ARN alone.
              - Sid: Dashboard
                Effect: Allow
                Action: ['cloudwatch:PutDashboard', 'cloudwatch:DeleteDashboards', 'cloudwatch:GetDashboard', 'cloudwatch:TagResource',
                         'cloudwatch:UntagResource', 'cloudwatch:ListTagsForResource']
                Resource: !Sub 'arn:${AWS::Partition}:cloudwatch::${AWS::AccountId}:dashboard/vega-v2'
              - Sid: RouteRule
                Effect: Allow
                Action: ['cloudwatch:PutInsightRule', 'cloudwatch:DeleteInsightRules', 'cloudwatch:EnableInsightRules', 'cloudwatch:DisableInsightRules',
                         'cloudwatch:TagResource', 'cloudwatch:UntagResource', 'cloudwatch:ListTagsForResource']
                Resource: !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:insight-rule/vega-v2-*'
              - Sid: RouteRuleList
                Effect: Allow
                Action: ['cloudwatch:DescribeInsightRules']
                Resource: '*'
              # PutTargets and RemoveTargets: AWS::Events::Rule's handler (GH204-e), the rules having no target today.
              - Sid: StopRules
                Effect: Allow
                Action: ['events:PutRule', 'events:DeleteRule', 'events:DescribeRule', 'events:EnableRule', 'events:DisableRule', 'events:TagResource',
                         'events:UntagResource', 'events:ListTagsForResource', 'events:ListTargetsByRule', 'events:PutTargets', 'events:RemoveTargets']
                Resource: !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/vega-v2-*'
              # --- end of alerts
              # The schedule that starts the live ingestor (live.yaml IngestorSchedule).
              - Sid: LiveSchedule
                Effect: Allow
                Action: ['scheduler:*']
                Resource: !Sub 'arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/vega-v2-live*'
              - Sid: Distribution
                Effect: Allow
                Action: ['cloudfront:*']
                Resource: '*'
              # GH149: the distribution's access logs (edge-logs.yaml, us-east-1): its delivery source, destination and
              # delivery under vega-v2-* names (a delivery's id is drawn by AWS), the resource policy CloudWatch Logs writes
              # on the group for delivery.logs.amazonaws.com when the one setting it up may (AWS's documented rights), and
              # the two saved queries (query definitions take no resource).
              - Sid: EdgeLogs
                Effect: Allow
                Action: ['logs:PutDeliverySource', 'logs:GetDeliverySource', 'logs:DeleteDeliverySource', 'logs:PutDeliveryDestination',
                         'logs:GetDeliveryDestination', 'logs:DeleteDeliveryDestination', 'logs:PutDeliveryDestinationPolicy',
                         'logs:GetDeliveryDestinationPolicy', 'logs:DeleteDeliveryDestinationPolicy', 'logs:CreateDelivery', 'logs:GetDelivery',
                         'logs:DeleteDelivery', 'logs:UpdateDeliveryConfiguration', 'logs:TagResource', 'logs:UntagResource', 'logs:ListTagsForResource']
                Resource:
                  - !Sub 'arn:${AWS::Partition}:logs:us-east-1:${AWS::AccountId}:delivery-source:vega-v2-*'
                  - !Sub 'arn:${AWS::Partition}:logs:us-east-1:${AWS::AccountId}:delivery-destination:vega-v2-*'
                  - !Sub 'arn:${AWS::Partition}:logs:us-east-1:${AWS::AccountId}:delivery:*'
              - Sid: EdgeLogsList
                Effect: Allow
                Action: ['logs:DescribeDeliveries', 'logs:DescribeDeliverySources', 'logs:DescribeDeliveryDestinations',
                         'logs:DescribeConfigurationTemplates', 'logs:PutQueryDefinition', 'logs:DeleteQueryDefinition', 'logs:DescribeQueryDefinitions']
                Resource: '*'
              - Sid: EdgeLogsGroupPolicy
                Effect: Allow
                Action: ['logs:PutResourcePolicy', 'logs:DescribeResourcePolicies', 'logs:DescribeLogGroups']
                Resource: !Sub 'arn:${AWS::Partition}:logs:us-east-1:${AWS::AccountId}:*'
              # BEGIN VI-35 web ACL: the distribution's web ACL (waf.yaml), CloudFront scope,
              # which exists in us-east-1 only; GetWebACL also lets the distribution take it.
              - Sid: WebAcl
                Effect: Allow
                Action: ['wafv2:CreateWebACL', 'wafv2:UpdateWebACL', 'wafv2:DeleteWebACL', 'wafv2:GetWebACL',
                         'wafv2:TagResource', 'wafv2:UntagResource', 'wafv2:ListTagsForResource']
                Resource: !Sub 'arn:${AWS::Partition}:wafv2:us-east-1:${AWS::AccountId}:global/webacl/vega-v2-*/*'
              - Sid: WebAclList
                Effect: Allow
                Action: ['wafv2:ListWebACLs']
                Resource: '*'
              # END VI-35 web ACL
  # The two buckets of worker.yaml and the media bucket's policy (api.yaml), as AWS's handlers of AWS::S3::Bucket and
  # AWS::S3::BucketPolicy document them (FAILURE_MODES_OPTIMISATIONS.md GH157-r, backend/tests/fixtures/
  # cfn-s3-handlers.json): the whole read handler, which reads every configuration back after a creation (s3:GetBucket*
  # did not match s3:ListBucket nor s3:Get…Configuration); create and update of the properties the template sets (name,
  # public access block, ownership, encryption, tags) and the handler's own check (s3:GetBucketAcl); delete; the policy.
  # No wildcard. A managed policy of its own: the role's inline policies are near IAM's 10 240 characters, and cfn-lint
  # 1.43.0 (CI's) does not know s3:GetBucketDefaultStorageClass yet (the read handler's, schema of 26 November 2026),
  # the one warning this resource ignores (W3037; test_deploy_grants.py checks its actions against AWS's schema).
  CloudFormationBuckets:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      cfn-lint: {config: {ignore_checks: [W3037]}}
    Properties:
      ManagedPolicyName: vega-v2-cloudformation-buckets
      Description: What vega-v2-cloudformation may do to the media and release buckets and the media bucket's policy.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: Buckets
            Effect: Allow
            Action: ['s3:CreateBucket', 's3:PutBucketPublicAccessBlock', 's3:PutBucketOwnershipControls', 's3:PutEncryptionConfiguration',
                   's3:PutBucketTagging', 's3:TagResource', 's3:UntagResource', 's3:GetBucketAcl', 's3:DeleteBucket',
                   's3:GetAccelerateConfiguration', 's3:GetAnalyticsConfiguration', 's3:GetBucketAbac', 's3:GetBucketCORS',
                   's3:GetBucketDefaultStorageClass', 's3:GetBucketLogging', 's3:GetBucketMetadataTableConfiguration',
                   's3:GetBucketNotification', 's3:GetBucketObjectLockConfiguration', 's3:GetBucketOwnershipControls',
                   's3:GetBucketPublicAccessBlock', 's3:GetBucketTagging', 's3:GetBucketVersioning', 's3:GetBucketWebsite',
                   's3:GetEncryptionConfiguration', 's3:GetIntelligentTieringConfiguration', 's3:GetInventoryConfiguration',
                   's3:GetLifecycleConfiguration', 's3:GetMetricsConfiguration', 's3:GetReplicationConfiguration', 's3:ListBucket',
                   's3:ListTagsForResource', 's3:GetBucketPolicy', 's3:PutBucketPolicy', 's3:DeleteBucketPolicy']
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::vega-v2-media-${AWS::AccountId}-${AWS::Region}'
              - !Sub 'arn:${AWS::Partition}:s3:::${ReleaseBucket}'
  # The Deploy's state (FAILURE_MODES_OPTIMISATIONS.md GH157.3): one object, state.json, read and written with
  # conditional requests by deploy.sh (infra/aws/deploy_state.py). Here, in the owner's stack, so that it exists before
  # anything a Deploy creates: one lock and one state for a first install as for any Deploy. Versioned: each state
  # written is kept (who held it, what it saved).
  DeployStateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'vega-v2-deploy-state-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
      OwnershipControls: {Rules: [{ObjectOwnership: BucketOwnerEnforced}]}
      BucketEncryption: {ServerSideEncryptionConfiguration: [{ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}}]}
      VersioningConfiguration: {Status: Enabled}
      LifecycleConfiguration: {Rules: [{Id: old-states, Status: Enabled, NoncurrentVersionExpiration: {NoncurrentDays: 90}}]}
      Tags: [{Key: project, Value: vega-v2}]
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: vega-v2-deploy
      MaxSessionDuration: 7200
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Federated: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'}
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:repository_id: '1441213700'
                token.actions.githubusercontent.com:workflow: 'Deploy'
                token.actions.githubusercontent.com:sub: !Ref GitHubSubject
      Policies:
        - PolicyName: DeployV2
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Stacks
                Effect: Allow
                Action: ['cloudformation:CreateStack', 'cloudformation:UpdateStack', 'cloudformation:CreateChangeSet',
                         'cloudformation:ExecuteChangeSet', 'cloudformation:DescribeChangeSet', 'cloudformation:DeleteChangeSet',
                         'cloudformation:DescribeStacks', 'cloudformation:DescribeStackEvents', 'cloudformation:GetTemplateSummary',
                         'cloudformation:ListStackResources']
                Resource:
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/vega-v2-*/*'
                  # Alerts: the edge stack lives in us-east-1 (alerts-edge.yaml).
                  - !Sub 'arn:${AWS::Partition}:cloudformation:us-east-1:${AWS::AccountId}:stack/vega-v2-alerts-edge/*'
                  # GH149: the distribution's access logs, in us-east-1 too (edge-logs.yaml).
                  - !Sub 'arn:${AWS::Partition}:cloudformation:us-east-1:${AWS::AccountId}:stack/vega-v2-edge-logs/*'
              # BEGIN VI-35 waf stack: vega-v2-waf, in us-east-1 (CloudFront scope).
              - Sid: WebAclStack
                Effect: Allow
                Action: ['cloudformation:CreateStack', 'cloudformation:UpdateStack', 'cloudformation:CreateChangeSet',
                         'cloudformation:ExecuteChangeSet', 'cloudformation:DescribeChangeSet', 'cloudformation:DeleteChangeSet',
                         'cloudformation:DescribeStacks', 'cloudformation:DescribeStackEvents', 'cloudformation:GetTemplateSummary']
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:us-east-1:${AWS::AccountId}:stack/vega-v2-waf/*'
              # END VI-35 waf stack
              - Sid: Templates
                Effect: Allow
                Action: ['cloudformation:ValidateTemplate', 'cloudformation:ListExports']
                Resource: '*'
              - Sid: HandStacksToCloudFormation
                Effect: Allow
                Action: 'iam:PassRole'
                Resource: !GetAtt CloudFormationRole.Arn
              # ecr:DescribeRepositories: step 3 asks whether the repository exists (a first install) before anything stops
              # (GH157-q: called since GH157, granted since the review of 26 November 2026).
              - Sid: Image
                Effect: Allow
                Action: ['ecr:BatchCheckLayerAvailability', 'ecr:InitiateLayerUpload', 'ecr:UploadLayerPart', 'ecr:CompleteLayerUpload',
                         'ecr:PutImage', 'ecr:BatchGetImage', 'ecr:DescribeImages', 'ecr:DescribeRepositories']
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/vega-v2-worker'
              - Sid: RegistryLogin
                Effect: Allow
                Action: 'ecr:GetAuthorizationToken'
                Resource: '*'
              - Sid: Release
                Effect: Allow
                Action: ['s3:PutObject', 's3:GetObject']
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${ReleaseBucket}/releases/v2-api/*'
                  - !Sub 'arn:${AWS::Partition}:s3:::${ReleaseBucket}/releases/v2-live/*'
                  - !Sub 'arn:${AWS::Partition}:s3:::${ReleaseBucket}/releases/v2-account/*'
              # GH157.3: the Deploy's own state, read and written with conditional requests (infra/aws/deploy_state.py):
              # the one object of the bucket this stack creates (DeployStateBucket), nothing else of it.
              - Sid: DeployState
                Effect: Allow
                Action: ['s3:PutObject', 's3:GetObject']
                Resource: !Sub 'arn:${AWS::Partition}:s3:::vega-v2-deploy-state-${AWS::AccountId}-${AWS::Region}/state.json'
              # GH157-s: whether the release bucket exists, before any change (head-bucket).
              - Sid: ReleaseBucketExists
                Effect: Allow
                Action: 's3:ListBucket'
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ReleaseBucket}'
              - Sid: Secrets
                Effect: Allow
                Action: ['ssm:GetParameter', 'ssm:PutParameter']
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/vega/v2/*'
              - Sid: SecretsKey
                Effect: Allow
                Action: ['kms:Encrypt', 'kms:Decrypt', 'kms:GenerateDataKey']
                Resource: '*'
                Condition: {StringEquals: {'kms:ViaService': !Sub 'ssm.${AWS::Region}.amazonaws.com'}}
              - Sid: OneOffTasks
                Effect: Allow
                Action: 'ecs:RunTask'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/vega-v2-migrate:*'
                  - !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/vega-v2-archives:*'
              - Sid: TaskStatus
                Effect: Allow
                Action: ['ecs:DescribeTasks', 'ecs:DescribeServices']
                Resource: '*'
              # GH157.3: a migrate task found by its token (startedBy), or any still running before a run asks for its own.
              - Sid: TaskList
                Effect: Allow
                Action: 'ecs:ListTasks'
                Resource: '*'
                Condition: {ArnEquals: {'ecs:cluster': !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/vega-v2'}}
              - Sid: TaskRoles
                Effect: Allow
                Action: 'iam:PassRole'
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/vega-v2-worker-*'
                Condition: {StringEquals: {'iam:PassedToService': 'ecs-tasks.amazonaws.com'}}
              - Sid: TaskLogs
                Effect: Allow
                Action: ['logs:GetLogEvents', 'logs:FilterLogEvents']
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/vega-v2-worker:*'
  # The isolated pilot (.github/workflows/pilot.yml, by hand from main) reads its own provider key from SSM with this
  # role, and nothing else: /vega/v2/pitchapi-pilot-key, never the worker's key (FAILURE_MODES_OPTIMISATIONS.md, GH194). Until
  # 25 November 2026 it read the worker's key and trusted every claude/v2-* branch too.
  PilotRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: vega-v2-pilot
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Federated: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'}
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:repository_id: '1441213700'
                token.actions.githubusercontent.com:workflow: 'Isolated pilot'
                token.actions.githubusercontent.com:sub: 'repo:VegaInteligence@188998341/Vega-Sport@1441213700:ref:refs/heads/main'
      Policies:
        - PolicyName: PilotKeyOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: PilotKey
                Effect: Allow
                Action: 'ssm:GetParameter'
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/vega/v2/pitchapi-pilot-key'
              - Sid: PilotKeyDecrypt
                Effect: Allow
                Action: 'kms:Decrypt'
                Resource: '*'
                Condition: {StringEquals: {'kms:ViaService': !Sub 'ssm.${AWS::Region}.amazonaws.com'}}
Outputs:
  # Read by deploy.sh's account preflight (backend/account/FAILURE_MODES.md W4): 2 once this stack
  # holds the account API's grants above, the VPC of SecurityGroupCreate included (W14; 1 lacked
  # it). The Deploy cannot update this stack; the owner does, from his Mac
  # (backend/account/DEPLOYMENT.md, section 3).
  AccountGrants: {Value: '2'}
  # Read by deploy.sh's preflight (FAILURE_MODES_OPTIMISATIONS.md GH157): 1 once this stack holds the grants of 26 November
  # 2026 (the Deploy's state object, the edge logs in us-east-1, the alarms, rules and dashboard of GH204, the RDS log
  # group of GH171; after the reviews of that day: the Deploy state's own bucket and object, ecr:DescribeRepositories,
  # the release bucket's existence, the tasks a run settles, the buckets' and the alerts' handlers). The owner deploys it
  # from the Mac before the next Deploy.
  DeployStateBucket: {Value: !Ref DeployStateBucket}
  DeployGrants: {Value: '1'}
  PilotRoleArn: {Value: !GetAtt PilotRole.Arn}
  DeployRoleArn: {Value: !GetAtt DeployRole.Arn}
  CloudFormationRoleArn: {Value: !GetAtt CloudFormationRole.Arn}
