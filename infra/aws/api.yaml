AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Vega read API (backend/api) behind its own CloudFront distribution. It reads the
  database as vega_read only.
Parameters:
  ReleaseKey: {Type: String, AllowedPattern: 'releases/v2-api/[a-f0-9]{64}\.zip'}
  ReadDatabaseUrl: {Type: String, NoEcho: true, MaxLength: 2000, Description: 'vega_v2_read login on vega-football-db-postgres, without sslmode (the function verifies TLS with the bundled CA)'}
  ReservedConcurrency:
    Type: Number
    Default: 32
    MinValue: 1
    MaxValue: 90
    Description: >-
      Copies of the function that may run at once; each keeps one connection of the login
      vega_v2_read, whose limit is twice this number plus a margin (backend/vega/migrate.py;
      backend/tests/test_api_capacity.py keeps them together). deploy.sh passes it.
  OpsKey:
    Type: String
    NoEcho: true
    Default: ''
    AllowedPattern: '([A-Za-z0-9_-]{32,128})?'
    Description: 'Key of /api/ops/status (SSM /vega/v2/ops-key), sent by the private status page as X-Vega-Ops-Key; empty, no such route'
  MediaBaseUrl:
    Type: String
    Default: ''
    AllowedPattern: '(https://[a-z0-9.-]+/)?'
    Description: 'This distribution, https://<ApiOrigin domain>/, once known (second deploy); empty, no media map'
  # BEGIN VI-35 web ACL
  WebAclArn:
    Type: String
    Default: ''
    AllowedPattern: '(arn:aws:wafv2:us-east-1:[0-9]{12}:global/webacl/vega-v2-[A-Za-z0-9-]+/[a-f0-9-]{36})?'
    Description: 'Web ACL of the distribution (waf.yaml, stack vega-v2-waf in us-east-1, output WebAclArn); empty, none'
Conditions:
  HasWebAcl: !Not [!Equals [!Ref WebAclArn, '']]
  # END VI-35 web ACL
Resources:
  Logs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/vega-v2-api
      RetentionInDays: 14
  RuntimeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: 'sts:AssumeRole'}]
      Policies:
        - PolicyName: Runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['logs:CreateLogStream','logs:PutLogEvents']
                Resource: !GetAtt Logs.Arn
              - Effect: Allow
                Action: ['ec2:CreateNetworkInterface','ec2:DescribeNetworkInterfaces','ec2:DescribeSubnets','ec2:DeleteNetworkInterface','ec2:AssignPrivateIpAddresses','ec2:UnassignPrivateIpAddresses']
                Resource: '*'
              - Effect: Deny
                Action: 'ec2:*'
                Resource: '*'
                Condition:
                  ArnEquals:
                    'lambda:SourceFunctionArn': !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:vega-v2-api'
  Backend:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: vega-v2-api
      Runtime: nodejs24.x
      Architectures: [arm64]
      Handler: index.handler
      # The function's processor share follows its memory. It builds and compresses its
      # answers itself (6.6 MB for a position group's players): twice the share of 512.
      MemorySize: 1024
      Timeout: 25
      # Always limited: without it the account's limit (1000) is the function's, and the
      # login's connections ran out at the thirteenth copy (20 November 2026).
      ReservedConcurrentExecutions: !Ref ReservedConcurrency
      Role: !GetAtt RuntimeRole.Arn
      Code: {S3Bucket: !Sub 'vega-v2-releases-${AWS::AccountId}-${AWS::Region}', S3Key: !Ref ReleaseKey}
      Environment:
        Variables:
          VEGA_RELEASE: !Ref ReleaseKey
          V2_READ_DATABASE_URL: !Ref ReadDatabaseUrl
          V2_MEDIA_BASE_URL: !Ref MediaBaseUrl
          V2_OPS_KEY: !Ref OpsKey
      VpcConfig:
        SecurityGroupIds: [!ImportValue vega-v2-api-sg]
        SubnetIds: [subnet-0233a9567335f56ce, subnet-04c9af303f55d9718, subnet-0e72516f361932c15]
  Origin:
    Type: AWS::Lambda::Url
    Properties: {AuthType: AWS_IAM, TargetFunctionArn: !GetAtt Backend.Arn, InvokeMode: BUFFERED}
  OAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: vega-v2-api
        OriginAccessControlOriginType: lambda
        SigningBehavior: always
        SigningProtocol: sigv4
  MediaOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: vega-v2-media
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  MediaReadByCloudFront:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !ImportValue vega-v2-media-bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: 's3:GetObject'
            Resource: !Sub
              - 'arn:${AWS::Partition}:s3:::${Bucket}/data/*'
              - Bucket: !ImportValue vega-v2-media-bucket
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
  Cache:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: vega-v2-api
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 60
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig: {CookieBehavior: none}
          HeadersConfig: {HeaderBehavior: none}
          QueryStringsConfig: {QueryStringBehavior: all}
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
  # GET /api/league-history (an archived season, s-maxage=3600): the default policy's cache key, but an hour at
  # most instead of 60 s (FAILURE_MODES_OPTIMISATIONS.md, GH137; GH #145 for this route only). DefaultTTL 0: an answer that says
  # nothing is not kept. A correction may stay an hour at a point of presence; an invalidation of
  # /api/league-history* removes it sooner.
  LeagueHistoryCache:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: vega-v2-api-league-history
        MinTTL: 0
        DefaultTTL: 0
        MaxTTL: 3600
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig: {CookieBehavior: none}
          HeadersConfig: {HeaderBehavior: none}
          QueryStringsConfig: {QueryStringBehavior: all}
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
  # GET /live/matches/{id} (live.yaml): the full live state, cached 2 s (doc "Live").
  LiveCache:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: vega-v2-live
        MinTTL: 0
        DefaultTTL: 2
        MaxTTL: 2
        ParametersInCacheKeyAndForwardedToOrigin:
          CookiesConfig: {CookieBehavior: none}
          HeadersConfig: {HeaderBehavior: none}
          QueryStringsConfig: {QueryStringBehavior: none}
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
  Validators:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: vega-v2-api-validators
        HeadersConfig: {HeaderBehavior: whitelist, Headers: [If-None-Match, If-Modified-Since]}
        CookiesConfig: {CookieBehavior: none}
        QueryStringsConfig: {QueryStringBehavior: none}
  # /api/ops/*: the status page's key reaches the function; nothing is cached.
  OpsHeaders:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: vega-v2-api-ops
        HeadersConfig: {HeaderBehavior: whitelist, Headers: [X-Vega-Ops-Key]}
        CookiesConfig: {CookieBehavior: none}
        QueryStringsConfig: {QueryStringBehavior: none}
  ViewerHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: vega-v2-api
        # JSON and images, never a page: nothing may run in them or frame them, and HTTPS
        # is remembered (backend/tests/test_api_security_headers.py).
        SecurityHeadersConfig:
          ContentTypeOptions: {Override: true}
          StrictTransportSecurity: {AccessControlMaxAgeSec: 63072000, IncludeSubdomains: true, Preload: false, Override: true}
          FrameOptions: {FrameOption: DENY, Override: true}
          ReferrerPolicy: {ReferrerPolicy: no-referrer, Override: true}
          ContentSecurityPolicy: {ContentSecurityPolicy: "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'", Override: true}
        CorsConfig:
          AccessControlAllowCredentials: false
          AccessControlAllowHeaders: {Items: ['*']}
          AccessControlAllowMethods: {Items: [GET, HEAD, OPTIONS]}
          AccessControlAllowOrigins: {Items: ['*']}
          AccessControlExposeHeaders:
            Items: [ETag, Content-Length, Cache-Control, Age, X-Cache, X-Data-Source, Server-Timing, Retry-After, X-Amzn-ErrorType]
          OriginOverride: true
  # The family of each request in the access logs (FAILURE_MODES_OPTIMISATIONS.md GH149; edge-logs.yaml): its route,
  # each identifier written id, else other. Never the path, an identifier, the query, a cookie or a header; the request
  # goes on unchanged (no cache key, header, path or origin changes). backend/api/test/edge-logs.test.mjs runs this code
  # as CloudFront does and fails when a route of the read API has no family here, or a family no route.
  EdgeFamily:
    Type: AWS::CloudFront::Function
    Properties:
      Name: vega-v2-api-family
      AutoPublish: true
      FunctionConfig:
        Comment: The read API's route of each request, for the access logs (GH149)
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        import cf from 'cloudfront';
        const ID = /^[mptl]_(?:[A-Za-z0-9]{6}|v[0-9]{7})$/;
        const KEY = /^[A-Za-z0-9_-]{1,64}$/;
        const FAMILIES = {};
        (
          'archives.details archives.index assets club-facts club-links clubs.europe clubs.europe.matches ' +
          'coach-portrait competitions cup-index cup-snapshot cup-table cups.edition cups.index ' +
          'dashboard.manifest fixtures fixtures.season forecasts.live forecasts.match forecasts.odds forecasts.season ' +
          'forecasts.swap health league-history matchdays nations ops.status player-form player-honours ' +
          'player-market-values players.facts-coverage rankings.associations rankings.award ' +
          'rankings.award.player rankings.breakouts rankings.club rankings.edition rankings.fates ' +
          'rankings.index rankings.leagues rankings.level rankings.level.player rankings.match ' +
          'rankings.power rankings.power.history rankings.power.player rankings.round rankings.rounds ' +
          'read.archive read.club read.clubs read.discipline read.home read.home-favourites read.home-local ' +
          'read.league read.performance read.player read.players read.presence scouting.routes search ' +
          'seasons.partition stadium standings status worldcup.matches matches.id matches.id.summary ' +
          'matches.id.absences matches.id.lineups.probable matches.id.lineups matches.id.events matches.id.shots ' +
          'matches.id.stats matches.id.players matches.id.players.halves matches.id.players.display ' +
          'matches.id.momentum matches.id.advanced matches.id.advanced.players matches.id.advanced.network ' +
          'matches.id.heatmaps matches.id.h2h players.id players.id.actions players.id.faced ' +
          'players.id.halves players.id.injuries players.id.partners players.id.physical players.id.return ' +
          'players.id.similar players.id.style players.id.transfers teams.id teams.id.absences ' +
          'teams.id.age-profile teams.id.passing teams.id.similar teams.id.squad teams.id.substitutions ' +
          'nations.id worldcup.matches.id live.config live.matches.id '
        ).trim().split(' ').forEach(function (name) { FAMILIES[name] = true; });
        function family(uri) {
          if (typeof uri !== 'string' || uri.length > 200) return 'other';
          const parts = uri.split('/');
          if (parts[0] !== '' || (parts[1] !== 'api' && parts[1] !== 'live')) return 'other';
          const rest = parts[1] === 'live' ? ['live'].concat(parts.slice(2)) : parts.slice(2);
          const named = [];
          for (let i = 0; i < rest.length; i++) {
            const part = rest[i];
            const key = i === 2 && rest[0] === 'worldcup' && rest[1] === 'matches' && KEY.test(part);
            named.push(ID.test(part) || key ? 'id' : part);
          }
          const name = named.join('.');
          return FAMILIES[name] === true ? name : 'other';
        }
        function handler(event) {
          cf.logCustomData(family(event.request.uri));
          return event.request;
        }
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Vega read API (Lambda origin) and image copies
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        # Countries refused with a 403 (hugo, 25 Nov 2026: North Korea only, for now).
        # The site has the same rule in the Vercel firewall. Test: backend/tests/test_api_geo_block.py.
        Restrictions:
          GeoRestriction:
            RestrictionType: blacklist
            Locations: [KP]
        # VI-35: the per-address limit (waf.yaml), when deploy.sh passes it.
        WebACLId: !If [HasWebAcl, !Ref WebAclArn, !Ref 'AWS::NoValue']
        Origins:
          - Id: api
            DomainName: !Select [2, !Split ['/', !GetAtt Origin.FunctionUrl]]
            OriginAccessControlId: !GetAtt OAC.Id
            # The distribution keeps its connections to the function 60 s (5 s by default):
            # a page's first reads no longer each open a new one.
            CustomOriginConfig: {OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2], OriginReadTimeout: 29, OriginKeepaliveTimeout: 60}
          - Id: media
            DomainName: !ImportValue vega-v2-media-domain
            OriginAccessControlId: !GetAtt MediaOAC.Id
            S3OriginConfig: {OriginAccessIdentity: ''}
          - Id: live
            DomainName: !ImportValue vega-v2-live-read-domain
            OriginAccessControlId: !GetAtt OAC.Id
            CustomOriginConfig: {OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2], OriginReadTimeout: 10}
        # Image copies: immutable, content-addressed (managed CachingOptimized policy).
        CacheBehaviors:
          - PathPattern: data/*
            TargetOriginId: media
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: false
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          - PathPattern: live/*
            TargetOriginId: live
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref LiveCache
            FunctionAssociations: [{EventType: viewer-request, FunctionARN: !GetAtt EdgeFamily.FunctionMetadata.FunctionARN}]
            ResponseHeadersPolicyId: !Ref ViewerHeaders
          # Operations reads of the private status page (managed CachingDisabled policy).
          - PathPattern: api/ops/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: false
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            FunctionAssociations: [{EventType: viewer-request, FunctionARN: !GetAtt EdgeFamily.FunctionMetadata.FunctionARN}]
            OriginRequestPolicyId: !Ref OpsHeaders
          # The archived seasons: the default behaviour, kept up to an hour (LeagueHistoryCache). This path only.
          - PathPattern: api/league-history
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref LeagueHistoryCache
            FunctionAssociations: [{EventType: viewer-request, FunctionARN: !GetAtt EdgeFamily.FunctionMetadata.FunctionARN}]
            OriginRequestPolicyId: !Ref Validators
            ResponseHeadersPolicyId: !Ref ViewerHeaders
        DefaultCacheBehavior:
          TargetOriginId: api
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: !Ref Cache
          OriginRequestPolicyId: !Ref Validators
          ResponseHeadersPolicyId: !Ref ViewerHeaders
          FunctionAssociations: [{EventType: viewer-request, FunctionARN: !GetAtt EdgeFamily.FunctionMetadata.FunctionARN}]
        CustomErrorResponses:
          - {ErrorCode: 400, ErrorCachingMinTTL: 0}
          - {ErrorCode: 403, ErrorCachingMinTTL: 0}
          - {ErrorCode: 404, ErrorCachingMinTTL: 0}
          - {ErrorCode: 405, ErrorCachingMinTTL: 0}
          - {ErrorCode: 500, ErrorCachingMinTTL: 0}
          - {ErrorCode: 502, ErrorCachingMinTTL: 0}
          - {ErrorCode: 503, ErrorCachingMinTTL: 0}
          - {ErrorCode: 504, ErrorCachingMinTTL: 0}
  InvokeUrl:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Backend
      Action: lambda:InvokeFunctionUrl
      FunctionUrlAuthType: AWS_IAM
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
  Invoke:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Backend
      Action: lambda:InvokeFunction
      InvokedViaFunctionUrl: true
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
  InvokeLiveUrl:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !ImportValue vega-v2-live-read-function
      Action: lambda:InvokeFunctionUrl
      FunctionUrlAuthType: AWS_IAM
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
  InvokeLive:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !ImportValue vega-v2-live-read-function
      Action: lambda:InvokeFunction
      InvokedViaFunctionUrl: true
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
Outputs:
  ApiOrigin: {Value: !Sub 'https://${Distribution.DomainName}'}
  DistributionId: {Value: !Ref Distribution}
  SignedOrigin: {Value: !GetAtt Origin.FunctionUrl}
