AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Vega v2 live (doc "Live"): the live store (DynamoDB, on demand, items expiring on
  expires_at), the broadcast (AppSync Events, namespace live, channel /live/match/{id}:
  the ingestor publishes with IAM, browsers subscribe with a public key), the full-state
  read GET /live/matches/{id} (a function outside the private network, served at live/*
  by the v2 distribution with a 2 s cache, api.yaml), and the ingestor (one ECS task
  that EventBridge Scheduler starts before the first kick-off and that stops itself
  after the last match, off until a live provider is chosen). Live data never enters
  core; only the differences with the final data go to ops.live_discrepancies.
Parameters:
  ImageTag: {Type: String, AllowedPattern: '[a-f0-9]{12,64}', Description: Image of vega-v2-worker (the ingestor is vega_v2.live).}
  ReleaseKey: {Type: String, AllowedPattern: 'releases/v2-live/[a-f0-9]{64}\.zip'}
  LiveProvider: {Type: String, Default: '', AllowedPattern: '[a-z0-9_]{0,40}', Description: 'Adapter name in vega_v2/live/adapters.py; empty: the schedule is off'}
  ApiKeyExpires: {Type: Number, Description: 'Epoch seconds of the browser key expiry, 1 to 365 days ahead (deploy.sh renews it)'}
  CollectUrlParameter: {Type: String, Default: /vega/v2/collect-database-url}
Conditions:
  HasProvider: !Not [!Equals [!Ref LiveProvider, '']]
Resources:
  StateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: vega-v2-live-state
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: match, AttributeType: S}]
      KeySchema: [{AttributeName: match, KeyType: HASH}]
      TimeToLiveSpecification: {AttributeName: expires_at, Enabled: true}
      Tags: [{Key: project, Value: vega-v2}]
  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: vega-v2-live-events
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: match, AttributeType: S}, {AttributeName: seq, AttributeType: N}]
      KeySchema: [{AttributeName: match, KeyType: HASH}, {AttributeName: seq, KeyType: RANGE}]
      TimeToLiveSpecification: {AttributeName: expires_at, Enabled: true}
      Tags: [{Key: project, Value: vega-v2}]
  # live_team_stats: one item per team (doc "Tables temporaires").
  StatsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: vega-v2-live-team-stats
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: match, AttributeType: S}, {AttributeName: team_id, AttributeType: S}]
      KeySchema: [{AttributeName: match, KeyType: HASH}, {AttributeName: team_id, KeyType: RANGE}]
      TimeToLiveSpecification: {AttributeName: expires_at, Enabled: true}
      Tags: [{Key: project, Value: vega-v2}]
  EventsApi:
    Type: AWS::AppSync::Api
    Properties:
      Name: vega-v2-live
      EventConfig:
        AuthProviders: [{AuthType: API_KEY}, {AuthType: AWS_IAM}]
        ConnectionAuthModes: [{AuthType: API_KEY}, {AuthType: AWS_IAM}]
        DefaultPublishAuthModes: [{AuthType: AWS_IAM}]
        DefaultSubscribeAuthModes: [{AuthType: API_KEY}]
      Tags: [{Key: project, Value: vega-v2}]
  LiveNamespace:
    Type: AWS::AppSync::ChannelNamespace
    Properties:
      ApiId: !GetAtt EventsApi.ApiId
      Name: live
      PublishAuthModes: [{AuthType: AWS_IAM}]
      SubscribeAuthModes: [{AuthType: API_KEY}]
  BrowserKey:
    Type: AWS::AppSync::ApiKey
    Properties:
      ApiId: !GetAtt EventsApi.ApiId
      Description: Browsers subscribe to /live/match/{id}; publishing needs IAM
      Expires: !Ref ApiKeyExpires
  ReadLogs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: /aws/lambda/vega-v2-live-read, RetentionInDays: 14}
  ReadRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: 'sts:AssumeRole'}]
      Policies:
        - PolicyName: ReadLiveTables
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['logs:CreateLogStream', 'logs:PutLogEvents']
                Resource: !GetAtt ReadLogs.Arn
              - Effect: Allow
                Action: ['dynamodb:GetItem', 'dynamodb:Query']
                Resource: [!GetAtt StateTable.Arn, !GetAtt EventsTable.Arn, !GetAtt StatsTable.Arn]
  Read:
    Type: AWS::Lambda::Function
    DependsOn: ReadLogs
    Properties:
      FunctionName: vega-v2-live-read
      Runtime: nodejs24.x
      Architectures: [arm64]
      Handler: index.handler
      MemorySize: 256
      Timeout: 10
      Role: !GetAtt ReadRole.Arn
      Code: {S3Bucket: !Sub 'statarena-backend-releases-${AWS::AccountId}-${AWS::Region}', S3Key: !Ref ReleaseKey}
      Environment:
        Variables:
          V2_LIVE_STATE_TABLE: !Ref StateTable
          V2_LIVE_EVENTS_TABLE: !Ref EventsTable
          V2_LIVE_STATS_TABLE: !Ref StatsTable
  ReadUrl:
    Type: AWS::Lambda::Url
    Properties: {AuthType: AWS_IAM, TargetFunctionArn: !GetAtt Read.Arn, InvokeMode: BUFFERED}
  IngestorLogs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: /ecs/vega-v2-live, RetentionInDays: 30}
  IngestorExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: 'sts:AssumeRole'}]
      ManagedPolicyArns: ['arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy']
      Policies:
        - PolicyName: DatabaseUrl
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'ssm:GetParameters'
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${CollectUrlParameter}'
  # The ingestor writes the live tables and publishes on the live namespace, nothing else.
  IngestorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: 'sts:AssumeRole'}]
      Policies:
        - PolicyName: LiveStoreAndBroadcast
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['dynamodb:GetItem', 'dynamodb:PutItem', 'dynamodb:UpdateItem', 'dynamodb:Query', 'dynamodb:Scan']
                Resource: [!GetAtt StateTable.Arn, !GetAtt EventsTable.Arn, !GetAtt StatsTable.Arn]
              - Effect: Allow
                Action: 'appsync:EventPublish'
                Resource: !Sub '${EventsApi.ApiArn}/channelNamespace/live'
  IngestorTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: vega-v2-live
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      RuntimePlatform: {CpuArchitecture: ARM64, OperatingSystemFamily: LINUX}
      ExecutionRoleArn: !GetAtt IngestorExecutionRole.Arn
      TaskRoleArn: !GetAtt IngestorRole.Arn
      ContainerDefinitions:
        - Name: live
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/vega-v2-worker:${ImageTag}'
          Essential: true
          EntryPoint: [python, -m, vega_v2.live]
          # Stops by itself once no match is under way, upcoming or waiting for core.
          Command: [--until-idle]
          StopTimeout: 30
          ReadonlyRootFilesystem: true
          Environment:
            - {Name: V2_LIVE_PROVIDER, Value: !Ref LiveProvider}
            - {Name: V2_LIVE_STATE_TABLE, Value: !Ref StateTable}
            - {Name: V2_LIVE_EVENTS_TABLE, Value: !Ref EventsTable}
            - {Name: V2_LIVE_STATS_TABLE, Value: !Ref StatsTable}
            - {Name: V2_LIVE_EVENTS_HTTP, Value: !GetAtt EventsApi.Dns.Http}
            - {Name: AWS_REGION, Value: !Ref 'AWS::Region'}
          Secrets:
            - {Name: V2_DATABASE_URL, ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${CollectUrlParameter}'}
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: !Ref IngestorLogs, awslogs-region: !Ref 'AWS::Region', awslogs-stream-prefix: live}
  # EventBridge Scheduler starts the ingestor every 15 minutes while a provider is set. A
  # start with no match within 30 minutes exits in seconds; the first one ahead of a
  # kick-off follows every match to the last whistle (doc "Briques": started before the
  # day's first kick-off, stopped after the last); a start while one runs finds its lease
  # taken and exits, so there is never more than one feed per match.
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: scheduler.amazonaws.com}
            Action: 'sts:AssumeRole'
            Condition: {StringEquals: {'aws:SourceAccount': !Ref 'AWS::AccountId'}}
      Policies:
        - PolicyName: RunIngestor
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'ecs:RunTask'
                Resource: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/vega-v2-live:*'
                Condition: {ArnEquals: {'ecs:cluster': !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/vega-v2'}}
              - Effect: Allow
                Action: 'iam:PassRole'
                Resource: [!GetAtt IngestorExecutionRole.Arn, !GetAtt IngestorRole.Arn]
                Condition: {StringEquals: {'iam:PassedToService': ecs-tasks.amazonaws.com}}
  IngestorSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: vega-v2-live-ingestor
      Description: Starts the live ingestor (python -m vega_v2.live --until-idle)
      ScheduleExpression: rate(15 minutes)
      FlexibleTimeWindow: {Mode: 'OFF'}
      State: !If [HasProvider, ENABLED, DISABLED]
      Target:
        Arn: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/vega-v2'
        RoleArn: !GetAtt SchedulerRole.Arn
        RetryPolicy: {MaximumRetryAttempts: 0}
        EcsParameters:
          TaskDefinitionArn: !Ref IngestorTask
          TaskCount: 1
          LaunchType: FARGATE
          NetworkConfiguration:
            AwsvpcConfiguration:
              AssignPublicIp: ENABLED
              SecurityGroups: [!ImportValue vega-v2-worker-sg]
              Subnets: [subnet-0233a9567335f56ce, subnet-04c9af303f55d9718, subnet-0e72516f361932c15]
Outputs:
  ReadDomain: {Value: !Select [2, !Split ['/', !GetAtt ReadUrl.FunctionUrl]], Export: {Name: vega-v2-live-read-domain}}
  ReadFunction: {Value: !Ref Read, Export: {Name: vega-v2-live-read-function}}
  EventsHttp: {Value: !GetAtt EventsApi.Dns.Http}
  EventsRealtime: {Value: !GetAtt EventsApi.Dns.Realtime}
  # Public by design: it only lets a browser subscribe (NEXT_PUBLIC_LIVE_EVENTS_KEY).
  BrowserKey: {Value: !GetAtt BrowserKey.ApiKey}
