AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Vega v2 worker (planner + collector + calculator) as one small always-on Fargate
  service, plus on-demand task definitions for the backfill and the migrations.
  Public IP in the default VPC subnets: outbound HTTPS without a NAT gateway; no
  inbound port is open.
Parameters:
  ImageTag: {Type: String, AllowedPattern: '[a-f0-9]{12,64}', Description: Immutable image tag (git SHA) in the vega-v2-worker repository.}
  DesiredCount: {Type: Number, Default: 1, AllowedValues: [0, 1]}
  CollectUrlParameter: {Type: String, Default: /vega/v2/collect-database-url}
  CalcUrlParameter: {Type: String, Default: /vega/v2/calc-database-url}
  PasswordParameterPrefix: {Type: String, Default: /vega/v2/password, Description: 'SecureStrings <prefix>-collect, -calc, -read'}
  PitchApiKeyParameter: {Type: String, Default: /vega/v2/pitchapi-key}
  SportsApiKeyParameter:
    Type: String
    Default: ''
    Description: SSM parameter of the SportsAPI key (ranking snapshots); empty to leave that source off
  ArchiveSourcesBucket:
    Type: String
    Default: ''
    AllowedPattern: '[a-z0-9.-]{0,63}'
    Description: "Bucket holding main's data/sources (read only, archive import); empty, no archive task"
Conditions:
  HasArchiveSources: !Not [!Equals [!Ref ArchiveSourcesBucket, '']]
  HasSportsApi: !Not [!Equals [!Ref SportsApiKeyParameter, '']]
Resources:
  Repository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: vega-v2-worker
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: {ScanOnPush: true}
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"keep 20 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":20},"action":{"type":"expire"}}]}'
      Tags: [{Key: project, Value: vega-v2}]
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: vega-v2
      ClusterSettings: [{Name: containerInsights, Value: disabled}]
      Tags: [{Key: project, Value: vega-v2}]
  Logs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: /ecs/vega-v2-worker, RetentionInDays: 30}
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: 'sts:AssumeRole'}]
      ManagedPolicyArns: ['arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy']
      Policies:
        - PolicyName: Secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['ssm:GetParameters']
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${CollectUrlParameter}'
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${CalcUrlParameter}'
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${PasswordParameterPrefix}-*'
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${PitchApiKeyParameter}'
                  - !If [HasSportsApi, !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SportsApiKeyParameter}', !Ref AWS::NoValue]
              - Effect: Allow
                Action: ['secretsmanager:GetSecretValue']
                Resource: !ImportValue vega-v2-db-master-secret
  # Copies of display images (vega_v2/media.py): private, served by the v2 CloudFront
  # distribution at data/* (api.yaml), content-addressed keys under data/sources/v2/images/.
  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'vega-v2-media-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
      OwnershipControls: {Rules: [{ObjectOwnership: BucketOwnerEnforced}]}
      BucketEncryption: {ServerSideEncryptionConfiguration: [{ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}}]}
      Tags: [{Key: project, Value: vega-v2}]
  # The only AWS API the code calls: the image copies (head, put; list so that a
  # missing key answers 404, not 403).
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: 'sts:AssumeRole'}]
      Policies:
        - PolicyName: MediaCopies
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['s3:GetObject', 's3:PutObject']
                Resource: !Sub '${MediaBucket.Arn}/data/sources/v2/images/*'
              - Effect: Allow
                Action: 's3:ListBucket'
                Resource: !GetAtt MediaBucket.Arn
                Condition: {StringLike: {'s3:prefix': 'data/sources/v2/images/*'}}
  WorkerTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: vega-v2-worker
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      RuntimePlatform: {CpuArchitecture: ARM64, OperatingSystemFamily: LINUX}
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: worker
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/vega-v2-worker:${ImageTag}'
          Essential: true
          Command: [--lanes, 'score,details,reference']
          StopTimeout: 60
          ReadonlyRootFilesystem: true
          Environment:
            - {Name: V2_MEDIA_BUCKET, Value: !Ref MediaBucket}
          Secrets:
            - {Name: V2_DATABASE_URL, ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${CollectUrlParameter}'}
            - {Name: V2_CALC_DATABASE_URL, ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${CalcUrlParameter}'}
            - {Name: PITCHAPI_API_KEY, ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${PitchApiKeyParameter}'}
            - !If
              - HasSportsApi
              - {Name: V2_SPORTSAPI_API_KEY, ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SportsApiKeyParameter}'}
              - !Ref AWS::NoValue
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: !Ref Logs, awslogs-region: !Ref 'AWS::Region', awslogs-stream-prefix: worker}
  BackfillTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: vega-v2-backfill
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      RuntimePlatform: {CpuArchitecture: ARM64, OperatingSystemFamily: LINUX}
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: backfill
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/vega-v2-worker:${ImageTag}'
          Essential: true
          # Runs for days, stops when the backfill lane is empty.
          Command: [--lanes, backfill, --until-idle]
          ReadonlyRootFilesystem: true
          Secrets:
            - {Name: V2_DATABASE_URL, ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${CollectUrlParameter}'}
            - {Name: V2_CALC_DATABASE_URL, ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${CalcUrlParameter}'}
            - {Name: PITCHAPI_API_KEY, ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${PitchApiKeyParameter}'}
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: !Ref Logs, awslogs-region: !Ref 'AWS::Region', awslogs-stream-prefix: backfill}
  MigrationTask:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: vega-v2-migrate
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      RuntimePlatform: {CpuArchitecture: ARM64, OperatingSystemFamily: LINUX}
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: migrate
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/vega-v2-worker:${ImageTag}'
          Essential: true
          EntryPoint: [python, -m, vega_v2.migrate]
          ReadonlyRootFilesystem: true
          Environment:
            - {Name: V2_DB_HOST, Value: !ImportValue vega-v2-db-endpoint}
            - {Name: V2_DB_NAME, Value: vega_v2}
          Secrets:
            - Name: V2_DB_USER
              ValueFrom: !Join ['', [!ImportValue vega-v2-db-master-secret, ':username::']]
            - Name: V2_DB_PASSWORD
              ValueFrom: !Join ['', [!ImportValue vega-v2-db-master-secret, ':password::']]
            - {Name: V2_COLLECT_PASSWORD, ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${PasswordParameterPrefix}-collect'}
            - {Name: V2_CALC_PASSWORD, ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${PasswordParameterPrefix}-calc'}
            - {Name: V2_READ_PASSWORD, ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${PasswordParameterPrefix}-read'}
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: !Ref Logs, awslogs-region: !Ref 'AWS::Region', awslogs-stream-prefix: migrate}
  # One-off historical archive import (vega_v2/archives.py): reads main's pinned archive
  # sources, read only, and writes the archive seasons as the collect role.
  ArchiveRole:
    Type: AWS::IAM::Role
    Condition: HasArchiveSources
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: 'sts:AssumeRole'}]
      Policies:
        - PolicyName: ReadArchiveSources
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 's3:GetObject'
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${ArchiveSourcesBucket}/data/sources/openfootball/*'
                  - !Sub 'arn:${AWS::Partition}:s3:::${ArchiveSourcesBucket}/data/sources/engsoccerdata/*'
                  - !Sub 'arn:${AWS::Partition}:s3:::${ArchiveSourcesBucket}/data/sources/worldclub/*'
              - Effect: Allow
                Action: 's3:ListBucket'
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArchiveSourcesBucket}'
                Condition:
                  StringLike: {'s3:prefix': ['data/sources/openfootball/*', 'data/sources/engsoccerdata/*', 'data/sources/worldclub/*']}
  ArchiveTask:
    Type: AWS::ECS::TaskDefinition
    Condition: HasArchiveSources
    Properties:
      Family: vega-v2-archives
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '512'
      Memory: '2048'
      RuntimePlatform: {CpuArchitecture: ARM64, OperatingSystemFamily: LINUX}
      EphemeralStorage: {SizeInGiB: 30}
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt ArchiveRole.Arn
      ContainerDefinitions:
        - Name: archives
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/vega-v2-worker:${ImageTag}'
          Essential: true
          EntryPoint: [python, -m, vega_v2.archives]
          Command: [--sources, !Sub 's3://${ArchiveSourcesBucket}/data/sources']
          Secrets:
            - {Name: V2_DATABASE_URL, ValueFrom: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${CollectUrlParameter}'}
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: !Ref Logs, awslogs-region: !Ref 'AWS::Region', awslogs-stream-prefix: archives}
  Service:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: vega-v2-worker
      Cluster: !Ref Cluster
      TaskDefinition: !Ref WorkerTask
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      # One worker at a time: replace, never overlap (the planner and leases allow
      # overlap, but a single process keeps the PitchAPI rate predictable).
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups: [!ImportValue vega-v2-worker-sg]
          Subnets: [subnet-0233a9567335f56ce, subnet-04c9af303f55d9718, subnet-0e72516f361932c15]
      Tags: [{Key: project, Value: vega-v2}]
Outputs:
  RepositoryUri: {Value: !GetAtt Repository.RepositoryUri}
  Cluster: {Value: !Ref Cluster}
  BackfillTaskDefinition: {Value: !Ref BackfillTask}
  MigrationTaskDefinition: {Value: !Ref MigrationTask}
  ArchiveTaskDefinition: {Condition: HasArchiveSources, Value: !Ref ArchiveTask}
  MediaBucket: {Value: !Ref MediaBucket, Export: {Name: vega-v2-media-bucket}}
  MediaBucketDomain: {Value: !GetAtt MediaBucket.RegionalDomainName, Export: {Name: vega-v2-media-domain}}
